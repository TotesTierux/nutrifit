<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f766e">
<title>NutriFit – Ernährung, Training & Fasten</title>
<style>
:root{
  --text:#14201d; --card2:#eef2f1;
  --bg:#f4f6f5; --card:#ffffff; --ink:#14201d; --muted:#6b7a76; --line:#e3e9e7;
  --brand:#0f766e; --brand2:#14b8a6; --brandSoft:#e6f5f3;
  --p:#e8590c; --c:#2f6fdc; --f:#c99a06; --water:#1c8ad6; --danger:#d43c3c;
  --r:18px; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(15,40,35,.06);
}
@media (prefers-color-scheme:dark){
  :root{--text:#e9f1ef;--card2:#20302c;--bg:#0d1312;--card:#161f1d;--ink:#e9f1ef;--muted:#91a29e;--line:#24302d;--brandSoft:#123430;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
.app{max-width:560px;margin:0 auto;padding:12px 14px calc(96px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 12px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo .dot{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-size:15px}
.habbtn{min-width:104px;padding:10px 14px;font-size:15px;font-variant-numeric:tabular-nums}
.seg button{font-size:12.5px}
#modeSeg button{font-size:11.5px;padding:8px 1px;white-space:nowrap}
.gear{border:0;width:38px;height:38px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:17px;display:grid;place-items:center}
.gear.on{background:var(--brandSoft)}
.datenav{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.datenav button{border:0;background:none;width:30px;height:30px;border-radius:50%;font-size:16px}
.datenav button:active{background:var(--brandSoft)}
.datenav span{font-weight:600;font-size:13px;min-width:78px;text-align:center}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:15px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.hero{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center}
.hero .side b{display:block;font-size:20px}
.hero .side span{font-size:12px;color:var(--muted)}
.ring{position:relative;width:150px;height:150px}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .lbl b{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ring .lbl span{font-size:12px;color:var(--muted);margin-top:4px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.macro .nm{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.bar{height:7px;background:var(--line);border-radius:9px;overflow:hidden;margin:5px 0 3px}
.bar i{display:block;height:100%;border-radius:9px;transition:width .4s}
.macro .v{font-size:12.5px;font-weight:600}
.meal{padding:12px 0;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0;padding-top:2px}
.mealhead{display:flex;align-items:center;gap:10px}
.mealhead .ic{width:38px;height:38px;border-radius:12px;background:var(--brandSoft);display:grid;place-items:center;font-size:19px;flex:none}
.mealhead .t{flex:1}
.mealhead .t b{display:block;font-size:14.5px}
.mealhead .t span{font-size:12px;color:var(--muted)}
.addbtn{border:0;width:36px;height:36px;border-radius:50%;background:var(--brand);color:#fff;font-size:22px;line-height:1;display:grid;place-items:center;flex:none}
.addbtn:active{transform:scale(.94)}
.items{margin:8px 0 0 48px}
.item{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13.5px}
.item .n{flex:1;min-width:0}
.item .n div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .n small{color:var(--muted);font-size:11.5px}
.item .k{font-weight:600;font-size:13px}
.x{border:0;background:none;color:var(--muted);font-size:17px;width:28px;height:28px;border-radius:50%}
.x:active{background:var(--line)}
.water{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.glass{width:34px;height:42px;border:2px solid var(--water);border-radius:4px 4px 9px 9px;background:transparent;position:relative;overflow:hidden;padding:0}
.glass.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:78%;background:var(--water);opacity:.85}
.row{display:flex;gap:8px;align-items:center}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:600;background:var(--brand);color:#fff}
.btn.sec{background:var(--brandSoft);color:var(--brand)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.btn:active{transform:scale(.98)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav.tabs .in{display:flex;max-width:560px;width:100%;justify-content:space-around;align-items:center}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 10px;min-width:62px}
nav.tabs button .i{font-size:21px;filter:grayscale(1);opacity:.7}
nav.tabs button.on{color:var(--brand);font-weight:700}
nav.tabs button.on .i{filter:none;opacity:1}
nav.tabs .fab{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:24px;margin-top:-26px;box-shadow:0 6px 18px rgba(15,118,110,.4);justify-content:center;min-width:0;padding:0}
nav.tabs .fab .i{filter:none;opacity:1}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:40;display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.sheet .sh b{font-size:17px}
.sheet .sb{overflow:auto;padding:4px 16px calc(20px + env(safe-area-inset-bottom))}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:500}
.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;outline:none}
.inp:focus{border-color:var(--brand2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.list .li{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--card);border-radius:12px;margin-bottom:6px;border:0;width:100%;text-align:left}
.list .li:active{background:var(--brandSoft)}
.li .n{flex:1;min-width:0}
.li .n b{font-weight:600;font-size:14px;display:block}
.li .n small{color:var(--muted);font-size:12px}
.li .plus{color:var(--brand);font-size:22px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:12.5px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.photo{width:100%;border-radius:14px;max-height:240px;object-fit:cover;display:block;margin-bottom:10px}
.spin{width:22px;height:22px;border:3px solid var(--brandSoft);border-top-color:var(--brand);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#14201d;color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat b{display:block;font-size:19px}
.stat span{font-size:11.5px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:inherit}
.fastring{display:grid;place-items:center;margin:8px 0 14px}
.note{background:var(--brandSoft);color:var(--brand);border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.45}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.tips{font-size:13.5px;line-height:1.5}
.aiitem{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:6px;display:flex;gap:10px;align-items:center}
.aiitem input[type=number]{width:72px;padding:7px 8px}
.aiitem .n{flex:1;min-width:0}
.hidden{display:none!important}
h2.page{font-size:22px;letter-spacing:-.02em;margin:4px 2px 12px}
.onb{padding-top:10px}
.onb h1{font-size:26px;letter-spacing:-.03em;margin:8px 0 6px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.kv:first-child{border-top:0}
.score{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;font-weight:800;font-size:13px;color:#fff;flex:none}

/* ===== Training (ehem. FitLog) – im NutriFit-Design ===== */
.fit{--acc:var(--brand);--ink:#fff;--mute:var(--muted);--gold:#b7860b;--red:var(--danger);--blue:#2f6fdc;color:var(--text)}
.fit button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.fit input,.fit textarea{font-family:inherit;color:var(--text)}
.fit .screen{padding:0;animation:fitFade .18s ease}
.fit .top{display:flex;align-items:center;gap:10px;margin:2px 2px 14px}
.fit h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0}
.fit h2{font-size:19px;font-weight:750;letter-spacing:-.02em;margin:0}
.fit h3{display:block;font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:20px 4px 10px}
.fit .sub{color:var(--muted);font-size:13px}
.fit .grow{flex:1;min-width:0}
.fit .chip{border:0}
.fit .stat{display:block;text-align:left}
.fit .hero{display:block;text-align:left}
.fit .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 18px;border-radius:12px;font-weight:700;font-size:15px;background:var(--card2);color:var(--text);transition:transform .08s}
.fit .btn:active,.fit .icon:active,.fit .chk:active,.fit .stb:active{transform:scale(.94)}
.fit .btn.acc{background:var(--brand);color:#fff}
.fit .btn.sm{height:38px;padding:0 14px;font-size:14px;border-radius:10px}
.fit .btn.wide{width:100%;margin-top:8px}
.fit .btn.ghost{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.fit .btn.danger{background:rgba(212,60,60,.1);color:var(--danger)}
.fit .icon{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;background:var(--card2);font-size:18px;flex:none}
.fit .icon.sm{width:32px;height:32px;border-radius:10px;font-size:14px;background:transparent;color:var(--muted)}
.fit .chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;background:var(--card2);font-size:12.5px;font-weight:700;color:var(--muted);border:0}
.fit .chip.acc{background:var(--brandSoft);color:var(--brand)}
.fit .chip.gold{background:rgba(183,134,11,.12);color:var(--gold)}
.fit .row{display:flex;align-items:center;gap:8px}
.fit .sticky{margin:-12px -14px 12px;padding:12px 14px 10px}
.fit .sheetpad{padding:4px 16px calc(20px + env(safe-area-inset-bottom))}
#rest{background:var(--card);border:1px solid var(--line);color:var(--text)}
.fit .hero{background:linear-gradient(145deg,var(--brandSoft),var(--card) 70%);border:1px solid var(--line)}
.fit .stats{display:flex;gap:8px;margin-top:14px}
.fit .stat{flex:1;background:var(--bg);border-radius:14px;padding:10px 12px}
.fit .stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.4px}
.fit .stat span{font-size:12px;color:var(--mute)}
.fit .bar{height:8px;border-radius:9px;background:var(--card2);overflow:hidden}
.fit .bar>i{display:block;height:100%;border-radius:9px;background:var(--acc);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.fit .bar.gold>i{background:var(--gold)}
.fit .wo{display:flex;align-items:center;gap:12px}
.fit .wo .grow{cursor:pointer}
.fit .wo .name{font-weight:750;font-size:17px;margin-bottom:3px}
.fit .wo .ex{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fit .play{width:50px;height:50px;border-radius:16px;background:var(--acc);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.fit .banner{background:var(--acc);color:var(--ink);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:12px;font-weight:700;cursor:pointer}
.fit .banner .sub{color:rgba(255,255,255,.82)}
.fit .sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 14px 10px;margin:-22px -14px 12px}
.fit .prog{height:5px;border-radius:5px;background:var(--card2);overflow:hidden;margin-top:12px}
.fit .prog>i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.fit .ehead{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
.fit .ename{font-weight:750;font-size:17px}
.fit .setrow{display:flex;align-items:center;gap:6px;padding:6px 0;border-top:1px solid var(--line);transition:opacity .2s}
.fit .setrow:first-child{border-top:0}
.fit .sn{width:20px;font-size:13px;font-weight:700;color:var(--mute);text-align:center;flex:none}
.fit .step{flex:1;display:flex;align-items:center;background:var(--card2);border-radius:14px;height:52px;min-width:0}
.fit .stb{width:34px;height:52px;font-size:22px;font-weight:500;color:var(--mute);flex:none;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.fit .sv{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.fit .sv input{width:100%;background:none;border:0;outline:none;color:var(--text);text-align:center;font-size:21px;font-weight:800;padding:0;letter-spacing:-.3px}
.fit .sv small{font-size:10px;color:var(--mute);font-weight:600;margin-top:-2px;text-transform:uppercase;letter-spacing:.5px}
.fit .chk{width:46px;height:52px;border-radius:14px;background:var(--card2);color:var(--mute);font-size:20px;font-weight:800;flex:none;transition:background .15s,color .15s}
.fit .setrow.done .chk{background:var(--acc);color:var(--ink)}
.fit .setrow.done .step{background:var(--brandSoft)}
.fit .setrow.done .sv input{color:var(--acc)}
.fit .sw{width:40px;height:52px;border-radius:14px}
.fit .sw.run{background:var(--red);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.7}}
.fit .hint{font-size:12.5px;color:var(--mute);margin-top:2px}
.fit .hint b{color:var(--text);font-weight:600}
.fit .title-in{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:14px;color:var(--text);font-size:20px;font-weight:750;padding:14px;outline:none}
.fit .title-in:focus{border-color:var(--acc)}
.fit .irow{display:flex;gap:6px}
.fit .lbl{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px;font-weight:700;margin:0 0 5px 4px}
.fit .icol{flex:1;min-width:0}
.fit .hi{display:flex;align-items:center;gap:12px;cursor:pointer}
.fit .date{width:46px;height:50px;border-radius:14px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.fit .date b{font-size:18px;font-weight:800;line-height:1}
.fit .date span{font-size:10.5px;color:var(--mute);text-transform:uppercase;font-weight:700}
.fit .week{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:12px}
.fit .week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.fit .week i{display:block;width:100%;border-radius:7px;background:var(--card2);min-height:6px}
.fit .week i.on{background:var(--acc)}
.fit .week span{font-size:10.5px;color:var(--mute);font-weight:600}
.fit .tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.fit .tbl td{padding:7px 4px;border-top:1px solid var(--line)}
.fit .tbl td:last-child{text-align:right;color:var(--mute)}
.fit .lvl{display:flex;align-items:center;gap:16px}
.fit .ring{width:92px;height:92px;flex:none;position:relative}
.fit .ring svg{transform:rotate(-90deg)}
.fit .ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:30px;font-weight:850;letter-spacing:-1px}
.fit .ring b small{font-size:10px;color:var(--mute);letter-spacing:1px;font-weight:700}
.fit .badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fit .badge{background:var(--card);border-radius:18px;padding:14px 8px 12px;text-align:center;cursor:pointer}
.fit .badge .e{font-size:32px;line-height:1.1;height:38px}
.fit .badge .n{font-size:12.5px;font-weight:700;margin-top:6px;line-height:1.2}
.fit .badge .p{font-size:11px;color:var(--mute);margin-top:4px}
.fit .badge.off .e{filter:grayscale(1);opacity:.28}
.fit .badge.off .n{color:var(--mute)}
.fit .badge.on{background:linear-gradient(160deg,var(--brandSoft),var(--card))}
.fit .grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.fit .search{width:100%;background:var(--card);border:0;border-radius:14px;padding:14px;color:var(--text);font-size:16px;outline:none;margin-bottom:10px}
.fit .pick{display:flex;align-items:center;gap:10px;padding:13px 6px;border-bottom:1px solid var(--line);cursor:pointer}
.fit .pick:active{background:var(--card)}
.fit textarea.io{width:100%;height:160px;background:var(--card);border:0;border-radius:14px;color:var(--text);padding:12px;font-size:12px;outline:none}
.fit .sum{text-align:center;padding:10px 4px 4px}
.fit .sum .big{font-size:58px;font-weight:900;color:var(--acc);letter-spacing:-2px;line-height:1}
.fit .sum .em{font-size:54px}
.fit .li{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:11px 12px;margin-top:8px;text-align:left;font-size:14.5px}
.fit .li .e{font-size:24px}
#rest{position:fixed;left:14px;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:30;background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:10px 10px 10px 16px;display:none;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(15,40,35,.18)}
#rest.show{display:flex;animation:fitFade .2s}
#rest .t{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
#rest .bar{flex:1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
.fit .empty{text-align:center;color:var(--mute);padding:40px 20px;font-size:14.5px}
.fit .empty .e{font-size:44px;margin-bottom:8px}
</style>
</head>
<body>

/* ===================== Hilfsfunktionen ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r0=n=>Math.round(n||0), r1=n=>Math.round((n||0)*10)/10;
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>dkey(new Date());
let curDate=today(), tab="today";
function addDays(k,n){const d=new Date(k+"T12:00:00");d.setDate(d.getDate()+n);return dkey(d)}
function niceDate(k){
  if(k===today())return"Heute"; if(k===addDays(today(),-1))return"Gestern"; if(k===addDays(today(),1))return"Morgen";
  return new Date(k+"T12:00:00").toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"short"});
}
function day(k){if(!S.days[k])S.days[k]={meals:{breakfast:[],lunch:[],dinner:[],snack:[]},water:0,acts:[]};const d=S.days[k];d.meals=d.meals||{};MEALS.forEach(m=>d.meals[m.k]=d.meals[m.k]||[]);d.acts=d.acts||[];return d}
function peek(k){return S.days[k]}
function sumItems(arr){return arr.reduce((a,i)=>({kcal:a.kcal+i.kcal,p:a.p+i.p,c:a.c+i.c,f:a.f+i.f}),{kcal:0,p:0,c:0,f:0})}
function sessionKcal(s){const min=Math.min(180,Math.max(1,(s.end-s.start)/60000));const heavy=(s.entries||[]).some(e=>getEx(e.ex).type==="weight");return(heavy?5:4.5)*currentWeight()*min/60}
function daySessions(k){return F&&F.sessions?F.sessions.filter(s=>dkey(new Date(s.start))===k):[]}
function dayTotals(k){const d=peek(k);const ses=daySessions(k).reduce((a,s)=>a+sessionKcal(s),0);if(!d)return{kcal:0,p:0,c:0,f:0,burn:ses};const all=MEALS.flatMap(m=>d.meals[m.k]||[]);const t=sumItems(all);t.burn=(d.acts||[]).reduce((a,x)=>a+x.kcal,0)+ses;return t}
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),2200)}
function currentWeight(){const w=[...S.weights].sort((a,b)=>a.d<b.d?-1:1);return w.length?w[w.length-1].kg:(S.profile?S.profile.weight:70)}
function targets(){
  const p=S.profile; if(!p)return{kcal:2000,p:100,c:250,f:67,water:2000};
  const w=currentWeight();
  const bmr=10*w+6.25*p.height-5*p.age+(p.sex==="m"?5:-161);
  let tdee=bmr*p.activity;
  const adj={lose:-500,lose_slow:-250,keep:0,gain:300}[p.goal]||0;
  let kcal=Math.max(p.sex==="m"?1500:1200,Math.round((tdee+adj)/10)*10);
  if(p.customKcal)kcal=p.customKcal;
  const pr=Math.round(Math.max(1.6*w*(p.goal==="gain"?1.1:1),kcal*.2/4));
  const fat=Math.round(kcal*.3/9);
  const carb=Math.max(0,Math.round((kcal-pr*4-fat*9)/4));
  return{kcal,p:pr,c:carb,f:fat,water:Math.round(w*35/250)*250,bmr:Math.round(bmr),tdee:Math.round(tdee)};
}
function foodScore(it){ // einfache Nährwert-Ampel A–E pro 100 g
  const per=it.grams?100/it.grams:1; const kcal=it.kcal*per,p=it.p*per,f=it.f*per,c=it.c*per;
  let s=0; s+=kcal>400?3:kcal>250?2:kcal>150?1:0; s+=f>20?2:f>10?1:0; s-=p>15?2:p>8?1:0;
  if(it.cat==="Gemüse"||it.cat==="Obst")s-=2; if(it.cat==="Süßes"||it.cat==="Snacks")s+=2;
  const L=s<=0?"A":s<=1?"B":s<=3?"C":s<=4?"D":"E";
  const col={A:"#1e9e5a",B:"#7cb342",C:"#e3b505",D:"#ef7d22",E:"#d43c3c"}[L]; return{L,col};
}

/* ===================== Rendering ===================== */
function ring(size,stroke,val,max,color,track){
  const r=(size-stroke)/2,c=2*Math.PI*r,frac=Math.min(1,max?val/max:0);
  return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track||"var(--line)"}" stroke-width="${stroke}"/>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-frac)}" style="transition:stroke-dashoffset .5s"/></svg>`;
}
function render(){
  const app=$("#app");
  if(!S.profile){$("#tabs").classList.add("hidden");app.innerHTML=onboardingHTML();bindOnboarding();return}
  const focus=tab==="train"&&(ui.view==="session"||ui.view==="edit");
  $("#tabs").classList.toggle("hidden",focus);
  $("#rest").style.bottom=focus?"calc(14px + env(safe-area-inset-bottom))":"";
  document.querySelectorAll("nav.tabs [data-tab]").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  app.innerHTML=({today:todayHTML,train:trainHTML,stats:statsHTML,fast:fastHTML,profile:profileHTML})[tab]();
  if(tab==="train"&&ui.view==="session")updProg();
  bindPage();
}

  return `<header class="top"><div class="logo"><div class="dot">🥑</div>NutriFit</div><div class="row" style="gap:6px">${withDate?`<div class="datenav"><button data-act="prev">‹</button><span>${niceDate(curDate)}</span><button data-act="next">›</button></div>`:""}<button class="gear ${tab==="profile"?"on":""}" data-act="profile" aria-label="Profil & Einstellungen">⚙️</button></div></header>`;
}

  if(ui.view==="session"&&!F.active)ui.view="home";
  if(ui.view==="edit"&&!draft)ui.view="home";
  if(!["home","session","edit"].includes(ui.view))ui.view="home";
  const v={home:vHome,session:vSession,edit:vEdit}[ui.view];
  return (ui.view==="home"?headerHTML(false):"")+`<div class="fit">${v()}</div>`;
}
function todayHTML(){
  const T=targets(), t=dayTotals(curDate), d=day(curDate);
  const eaten=r0(t.kcal), burn=r0(t.burn), left=T.kcal-eaten+burn;
  const over=left<0;
  const mac=(nm,v,max,col)=>`<div class="macro"><div class="nm"><span>${nm}</span></div><div class="bar"><i style="width:${Math.min(100,max?v/max*100:0)}%;background:${col}"></i></div><div class="v">${r0(v)} / ${max} g</div></div>`;
  const glasses=Math.max(8,Math.ceil(T.water/250));
  let meals="";
  MEALS.forEach(m=>{
    const items=d.meals[m.k]; const s=sumItems(items); const goal=Math.round(T.kcal*m.share);
    meals+=`<div class="meal"><div class="mealhead"><div class="ic">${m.ic}</div><div class="t"><b>${m.n}</b><span>${r0(s.kcal)} / ${goal} kcal</span></div><button class="addbtn" data-add="${m.k}" aria-label="${m.n} hinzufügen">+</button></div>
    ${items.length?`<div class="items">${items.map((it,i)=>{const sc=foodScore(it);return`<div class="item"><span class="score" style="background:${sc.col}">${sc.L}</span><div class="n"><div>${esc(it.name)}</div><small>${r0(it.grams)} g · E ${r0(it.p)} · K ${r0(it.c)} · F ${r0(it.f)}</small></div><span class="k">${r0(it.kcal)}</span><button class="x" data-del="${m.k}:${i}" aria-label="Entfernen">×</button></div>`}).join("")}</div>`:""}</div>`;
  });
  const ses=daySessions(curDate).map(s=>`<div class="item" data-go-detail="${s.id}" style="cursor:pointer"><span style="font-size:18px">🏋️</span><div class="n"><div>${esc(s.name)}</div><small>${Math.max(1,Math.round((s.end-s.start)/60000))} Min. · ${s.entries.reduce((k,e)=>k+e.sets.length,0)} Sätze · Training</small></div><span class="k">−${r0(sessionKcal(s))}</span><span class="muted" style="width:28px;text-align:center">›</span></div>`).join("");
  const activeBanner=F.active?`<div class="card" data-act="resume" style="background:var(--brand);color:#fff;cursor:pointer;display:flex;align-items:center;gap:10px"><span style="font-size:24px">🏋️</span><div style="flex:1"><b>Training läuft: ${esc(F.active.name)}</b><div class="small" style="opacity:.85">Tippen zum Fortsetzen</div></div><span style="font-size:20px">›</span></div>`:"";
  const acts=ses+d.acts.map((a,i)=>`<div class="item"><span style="font-size:18px">${a.ic||"🔥"}</span><div class="n"><div>${esc(a.name)}</div><small>${a.min} Min.</small></div><span class="k">−${r0(a.kcal)}</span><button class="x" data-delact="${i}">×</button></div>`).join("");
  return headerHTML(true)+activeBanner+`
  <div class="card">
    <div class="hero">

  </div>

  <div class="card"><h3>Mahlzeiten <span class="muted small">Ziel ${T.kcal} kcal</span></h3>${meals}</div>
  <div class="card"><h3>💧 Wasser <span class="muted small">${(d.water/1000).toFixed(2).replace(".",",")} / ${(T.water/1000).toFixed(1).replace(".",",")} l</span></h3>
    <div class="water">${Array.from({length:glasses},(_,i)=>`<button class="glass ${i<d.water/250?"on":""}" data-glass="${i}" aria-label="Glas ${i+1}"></button>`).join("")}</div>
    <div class="muted small" style="margin-top:8px">Tippe auf ein Glas (250 ml).</div></div>
  <div class="card"><h3>🔥 Training & Aktivität <span class="row" style="gap:6px"><button class="btn sec" style="padding:7px 12px;font-size:13px" data-act="addact">+ Sport</button><button class="btn" style="padding:7px 12px;font-size:13px" data-act="train">▶ Training</button></span></h3>
    ${acts||`<div class="muted small">Noch nichts eingetragen. Starte ein Training oder trage Sport wie Joggen oder Radfahren ein.</div>`}</div>
  <div class="card"><h3>⚖️ Gewicht</h3><div class="row"><div style="flex:1"><b style="font-size:22px">${String(r1(currentWeight())).replace(".",",")} kg</b><div class="muted small">Ziel: ${String(S.profile.target||"–").replace(".",",")} kg</div></div><button class="btn sec" data-act="weigh">Wiegen</button></div></div>`;
}
function statsHTML(){
  const T=targets(); const days=[]; for(let i=6;i>=0;i--)days.push(addDays(today(),-i));
  const vals=days.map(k=>dayTotals(k)); const logged=vals.filter(v=>v.kcal>0);
  const avg=logged.length?r0(logged.reduce((a,v)=>a+v.kcal,0)/logged.length):0;
  const avgP=logged.length?r0(logged.reduce((a,v)=>a+v.p,0)/logged.length):0;
  // Balken
  const W=340,H=170,pb=22,max=Math.max(T.kcal*1.25,...vals.map(v=>v.kcal));
  const bw=W/7*.56; let bars="";
  vals.forEach((v,i)=>{const x=W/7*i+(W/7-bw)/2,h=(H-pb-8)*v.kcal/max,y=H-pb-h;const col=v.kcal>T.kcal*1.05?"var(--danger)":"var(--brand)";
    bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(0,h)}" rx="5" fill="${col}" opacity="${days[i]===today()?1:.75}"/>
    <text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${new Date(days[i]+"T12:00").toLocaleDateString("de-DE",{weekday:"short"})}</text>`});
  const gy=H-pb-(H-pb-8)*T.kcal/max;
  bars+=`<line x1="0" x2="${W}" y1="${gy}" y2="${gy}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1"/><text x="${W-2}" y="${gy-4}" text-anchor="end">Ziel ${T.kcal}</text>`;
  // Gewicht
  const ws=[...S.weights].sort((a,b)=>a.d<b.d?-1:1).slice(-30); let wchart=`<div class="empty small">Trage dein Gewicht ein, um den Verlauf zu sehen.</div>`;
  if(ws.length>=2){const mn=Math.min(...ws.map(w=>w.kg),S.profile.target||99)-1,mx=Math.max(...ws.map(w=>w.kg))+1;
    const pts=ws.map((w,i)=>[10+(W-20)*i/(ws.length-1),10+(H-40)*(1-(w.kg-mn)/(mx-mn))]);
    const tY=S.profile.target?10+(H-40)*(1-(S.profile.target-mn)/(mx-mn)):null;
    wchart=`<svg class="chart" viewBox="0 0 ${W} ${H}">${tY!==null?`<line x1="0" x2="${W}" y1="${tY}" y2="${tY}" stroke="var(--brand2)" stroke-dasharray="4 4"/><text x="${W-2}" y="${tY-4}" text-anchor="end">Ziel ${S.profile.target} kg</text>`:""}
    <polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--brand)"/>`).join("")}
    <text x="10" y="${H-8}">${new Date(ws[0].d+"T12:00").toLocaleDateString("de-DE",{day:"numeric",month:"short"})}</text><text x="${W-10}" y="${H-8}" text-anchor="end">${new Date(ws[ws.length-1].d+"T12:00").toLocaleDateString("de-DE",{day:"numeric",month:"short"})}</text></svg>`}
  const tw=S.weights.length?currentWeight():S.profile.weight; const diff=r1(tw-S.profile.weight);
  // Makroverteilung Woche
  const sp=logged.reduce((a,v)=>a+v.p*4,0),sc=logged.reduce((a,v)=>a+v.c*4,0),sf=logged.reduce((a,v)=>a+v.f*9,0),st=sp+sc+sf||1;
  const segs=`<div class="seg">${[["nutri","Essen"],["train","Training"],["awards","Erfolge"],["habits","Gewohnheiten"]].map(([k,l])=>`<button data-prog="${k}" class="${progSeg===k?"on":""}">${l}</button>`).join("")}</div>`;
  if(progSeg==="train")return headerHTML(false)+`<h2 class="page">Fortschritt</h2>`+segs+`<div class="fit">${ui.view==="detail"?vDetail():vHistory()}</div>`;
  if(progSeg==="habits")return headerHTML(false)+`<h2 class="page">Fortschritt</h2>`+segs+habStatsHTML();
  if(progSeg==="awards")return headerHTML(false)+`<h2 class="page">Fortschritt</h2>`+segs+`<div class="fit">${vAwards()}</div>`;
  return headerHTML(false)+`<h2 class="page">Fortschritt</h2>`+segs+`
  <div class="card"><div class="stat"><div><b>${avg}</b><span>Ø kcal / Tag</span></div><div><b>${avgP} g</b><span>Ø Eiweiß</span></div><div><b>${logged.length}/7</b><span>Tage erfasst</span></div></div></div>
  <div class="card"><h3>Kalorien – letzte 7 Tage</h3><svg class="chart" viewBox="0 0 ${W} ${H}">${bars}</svg></div>
  <div class="card"><h3>Makroverteilung (7 Tage)</h3>
    <div class="bar" style="height:14px;display:flex"><i style="width:${sp/st*100}%;background:var(--p);border-radius:0"></i><i style="width:${sc/st*100}%;background:var(--c);border-radius:0"></i><i style="width:${sf/st*100}%;background:var(--f);border-radius:0"></i></div>
    <div class="row small" style="justify-content:space-between;margin-top:6px"><span>🟠 Eiweiß ${r0(sp/st*100)} %</span><span>🔵 KH ${r0(sc/st*100)} %</span><span>🟡 Fett ${r0(sf/st*100)} %</span></div>
    <div class="muted small" style="margin-top:6px">Empfehlung: ca. 20–30 % / 45–50 % / 25–30 %</div></div>
  <div class="card"><h3>Gewichtsverlauf <span class="muted small">${diff>0?"+":""}${String(diff).replace(".",",")} kg seit Start</span></h3>${wchart}</div>
  <div class="card"><h3>💡 Tipps für dich</h3><div class="tips">${tipsHTML(logged,T)}</div></div>`;
}
function tipsHTML(logged,T){
  if(!logged.length)return`<span class="muted">Erfasse ein paar Tage deine Mahlzeiten – dann bekommst du hier Hinweise.</span>`;
  const out=[]; const n=logged.length;
  const p=logged.reduce((a,v)=>a+v.p,0)/n, k=logged.reduce((a,v)=>a+v.kcal,0)/n, f=logged.reduce((a,v)=>a+v.f,0)/n;
  if(p<T.p*.8)out.push(`Du isst im Schnitt <b>${r0(p)} g Eiweiß</b> – Ziel sind ${T.p} g. Skyr, Quark, Linsen oder Hähnchen helfen.`);
  else out.push(`Deine Eiweißzufuhr ist gut (Ø ${r0(p)} g). Weiter so!`);
  if(k>T.kcal*1.1)out.push(`Du liegst im Schnitt <b>${r0(k-T.kcal)} kcal</b> über deinem Ziel.`);
  else if(k<T.kcal*.75)out.push(`Du isst deutlich weniger als dein Ziel. Zu starke Defizite sind schwer durchzuhalten – iss lieber regelmäßig.`);
  else out.push(`Deine Kalorienbilanz passt gut zu deinem Ziel.`);
  if(f>T.f*1.2)out.push(`Der Fettanteil ist hoch – achte auf Öl, Käse und Snacks.`);
  const wd=[...Array(7)].map((_,i)=>peek(addDays(today(),-i))).filter(Boolean); const wa=wd.length?wd.reduce((a,d)=>a+(d.water||0),0)/wd.length:0;
  if(wa<T.water*.7)out.push(`Trink mehr Wasser: Ø ${(wa/1000).toFixed(1).replace(".",",")} l, Ziel ${(T.water/1000).toFixed(1).replace(".",",")} l.`);
  return out.map(t=>`<div style="margin-bottom:6px">• ${t}</div>`).join("");
}
function fastHTML(){
  const F=S.fast; const now=Date.now(); const active=!!F.start;
  const el=active?(now-F.start)/36e5:0; const goal=F.hours;
  const fmt=h=>{const m=Math.floor(h*60);return Math.floor(m/60)+" h "+pad(m%60)+" min"};
  const phase=el<4?"Verdauung":el<12?"Blutzucker sinkt":el<16?"Fettverbrennung startet":el<18?"Ketose beginnt":"Autophagie";
  const hist=(F.history||[]).slice(-7).reverse();
  return headerHTML(false)+`<h2 class="page">Intervallfasten</h2>
  <div class="card" style="text-align:center">
    <div class="chips" style="justify-content:center">${FAST_PLANS.map(([h,l])=>`<button class="chip ${F.hours===h?"on":""}" data-plan="${h}">${l}</button>`).join("")}</div>
    <div class="fastring"><div class="ring" style="width:200px;height:200px">${ring(200,15,el,goal,el>=goal?"#1e9e5a":"var(--brand)")}<div class="lbl"><b id="fastClock" style="font-size:26px">${active?fmt(el):"–"}</b><span>${active?(el>=goal?"Ziel erreicht 🎉":"noch "+fmt(goal-el)):"Ziel: "+goal+" Stunden"}</span></div></div></div>
    ${active?`<div class="muted small" style="margin-bottom:12px">Gestartet ${new Date(F.start).toLocaleString("de-DE",{weekday:"short",hour:"2-digit",minute:"2-digit"})} · Phase: <b>${phase}</b></div>`:""}
    <button class="btn block ${active?"danger":""}" data-act="${active?"stopfast":"startfast"}">${active?"Fasten beenden":"Fasten starten"}</button>
  </div>
  <div class="card"><h3>Letzte Fastenperioden</h3>${hist.length?hist.map(h=>`<div class="kv"><span>${new Date(h.start).toLocaleDateString("de-DE",{weekday:"short",day:"numeric",month:"short"})}</span><b style="color:${h.dur>=h.goal?"#1e9e5a":"var(--ink)"}">${fmt(h.dur)} ${h.dur>=h.goal?"✓":""}</b></div>`).join(""):`<div class="muted small">Noch keine abgeschlossene Fastenperiode.</div>`}</div>
  ${notifCardHTML()}
  <div class="note">Intervallfasten ist nicht für alle geeignet – z. B. nicht in Schwangerschaft, bei Diabetes oder Essstörungen. Sprich im Zweifel mit deiner Ärztin oder deinem Arzt.</div>`;
}

function readProfile(){
  const n=id=>parseFloat(String($(id).value).replace(",","."));
  const p={sex:$("#pf_sex").value,age:n("#pf_age"),height:n("#pf_height"),weight:n("#pf_weight"),target:n("#pf_target")||null,goal:$("#pf_goal").value,activity:n("#pf_act"),customKcal:n("#pf_kcal")||null};
  if(!(p.age>=12&&p.age<=110)||!(p.height>=100&&p.height<=250)||!(p.weight>=30&&p.weight<=350)){toast("Bitte Alter, Größe und Gewicht prüfen.");return null}
  if(p.customKcal&&p.customKcal<1000){toast("Kalorienziel unter 1000 kcal ist nicht sinnvoll.");return null}
  return p;
}

/* ===================== Events auf Seiten ===================== */
function bindPage(){
  const app=$("#app");
  app.onchange=e=>{const t=e.target;
    if(t.id==="gemModel"){gem().model=t.value;save();toast("Modell: "+t.value);return}
    if(t.dataset.nset){nset()[t.dataset.nset]=t.checked;save();render();if(t.dataset.nset==="on"&&t.checked)ensureNotifPermission()}
    else if(t.dataset.q){nset()[t.dataset.q]=+t.value;save();render()}};
  app.onclick=e=>{
    const gd=e.target.closest("[data-go-detail]"); if(gd){go("detail",gd.dataset.goDetail);return}
    const cd=e.target.closest("[data-act=resume]"); if(cd){go("session");return}
    const b=e.target.closest("button"); if(!b||b.getAttribute("onclick"))return;
    const a=b.dataset.act;
    if(a==="updcheck"){b.disabled=true;b.textContent="Suche …";checkUpdate(true).then(()=>{if(tab==="profile")render()});return}
    if(a==="updshow"){openUpdate(updInfo);return}
    if(a==="gemsetup"){openGemSetup();return}
    if(a==="gemremove"){const g=gem();g.key="";g.models=[];g.model="";save();render();toast("Schlüssel entfernt");return}
    if(a==="gemtest"){b.disabled=true;b.textContent="Teste …";gemListModels().then(ms=>{toast("✓ Verbunden · "+gem().model);render()}).catch(e=>{toast(e.message==="offline"?"Keine Internetverbindung":e.message);render()});return}
    if(a==="hstart"){habStart(b.dataset.h);return}
    if(a==="hstop"){habStop(b.dataset.h);return}
    if(a==="habstats"){tab="stats";progSeg="habits";render();window.scrollTo(0,0);return}
    if(a==="hadd"){openHabAdd();return}
    if(a==="hnew"){openHabNew();return}
    if(a==="hmanage"){openHabManage();return}
    if(b.dataset.hsel){habSel=b.dataset.hsel;render();return}
    if(b.dataset.hdel){if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="Löschen?";b.style.width="auto";b.style.fontSize="12px";b.style.color="var(--danger)";return}hab().log=hab().log.filter(l=>l.id!==b.dataset.hdel);save();render();return}
    if(a==="profile"){tab=tab==="profile"?"today":"profile";render();window.scrollTo(0,0);return}
    if(a==="train"){go("home");return}
    if(a==="resume"){go("session");return}
    if(b.dataset.prog){progSeg=b.dataset.prog;if(progSeg==="train")ui.view="history";render();return}
    if(a==="prev"){curDate=addDays(curDate,-1);render()}
    else if(a==="next"){curDate=addDays(curDate,1);render()}
    else if(b.dataset.add){openAdd(b.dataset.add)}
    else if(b.dataset.del){const[m,i]=b.dataset.del.split(":");day(curDate).meals[m].splice(+i,1);save();render()}
    else if(b.dataset.glass!==undefined){const d=day(curDate),i=+b.dataset.glass;d.water=(d.water>=(i+1)*250)?i*250:(i+1)*250;save();render()}
    else if(a==="addact")openActivity();
    else if(b.dataset.delact!==undefined){day(curDate).acts.splice(+b.dataset.delact,1);save();render()}
    else if(a==="weigh")openWeigh();
    else if(b.dataset.plan){S.fast.hours=+b.dataset.plan;save();render()}
    else if(a==="startfast"){S.fast.start=Date.now();save();render();toast("Fasten gestartet");ensureNotifPermission()}
    else if(a==="notifallow"){NATIVE.requestNotifPermission()}
    else if(a==="notifsettings"){NATIVE.openNotifSettings()}
    else if(a==="stopfast"){const dur=(Date.now()-S.fast.start)/36e5;S.fast.history=(S.fast.history||[]).concat({start:S.fast.start,dur,goal:S.fast.hours}).slice(-60);S.fast.start=null;save();render();toast(dur>=S.fast.hours?"Geschafft! 🎉":"Fasten beendet")}
    else if(a==="saveprofile"){const p=readProfile();if(!p)return;const oldW=S.profile.weight;S.profile=p;if(p.weight!==oldW)logWeight(p.weight);save();render();toast("Gespeichert")}
    else if(b.dataset.delcustom!==undefined){S.custom.splice(+b.dataset.delcustom,1);save();render()}
    else if(a==="export")openExport();
    else if(a==="import")openImport();
    else if(a==="reset")openReset();
  };
}

/* ---------- Barcode-Scanner & Online-Suche (Open Food Facts) ---------- */
const OFF="https://world.openfoodfacts.org";
const NATIVE=window.AndroidBridge||null;
let scanStream=null, scanLoop=null, zxReader=null;
function scanHTML(){
  return `<div id="scanArea">
    <div style="position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3">
      <video id="scanVid" playsinline muted autoplay style="width:100%;height:100%;object-fit:cover;display:block"></video>
      <div style="position:absolute;left:12%;right:12%;top:38%;height:24%;border:3px solid rgba(255,255,255,.9);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)"></div>
      <div id="scanMsg" style="position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;font-size:13px">Kamera wird gestartet …</div>
    </div>
    <div class="row" style="margin-top:10px"><input class="inp" id="eanIn" inputmode="numeric" placeholder="Oder Barcode-Nummer eintippen"><button class="btn" id="eanGo">Los</button></div>
    <div id="scanRes" style="margin-top:10px"></div></div>`;
}
async function startScan(){
  const msg=t=>{const m=$("#scanMsg");if(m)m.textContent=t};
  $("#eanGo").onclick=()=>{const c=$("#eanIn").value.replace(/\D/g,"");if(c.length>=6){stopScan();lookupBarcode(c)}};
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
  }catch(e){msg("Kein Kamerazugriff – erlaube die Kamera in den App-Einstellungen oder tippe die Nummer ein.");return}
  const v=$("#scanVid"); if(!v){stopScan();return}
  v.srcObject=scanStream; try{await v.play()}catch(e){}
  msg("Barcode in den Rahmen halten");
  let det=null;
  try{if("BarcodeDetector" in window){const f=await BarcodeDetector.getSupportedFormats();if(f.includes("ean_13"))det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]})}}catch(e){}
  if(det){
    const tick=async()=>{if(!scanStream)return;try{const r=await det.detect(v);if(r&&r[0]){found(r[0].rawValue);return}}catch(e){}scanLoop=setTimeout(tick,250)};tick();
  }else if(window.ZXing){
    const hints=new Map();hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.EAN_8,ZXing.BarcodeFormat.UPC_A,ZXing.BarcodeFormat.UPC_E]);hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
    zxReader=new ZXing.MultiFormatReader();zxReader.setHints(hints);
    const cv=document.createElement("canvas"),ctx=cv.getContext("2d",{willReadFrequently:true});
    const tick=()=>{if(!scanStream)return;
      if(v.videoWidth){const w=v.videoWidth,h=v.videoHeight,cw=Math.round(w*.8),ch=Math.round(h*.4);cv.width=cw;cv.height=ch;ctx.drawImage(v,(w-cw)/2,(h-ch)/2,cw,ch,0,0,cw,ch);
        try{const src=new ZXing.HTMLCanvasElementLuminanceSource(cv);const bmp=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src));const r=zxReader.decode(bmp);if(r){found(r.getText());return}}catch(e){}}
      scanLoop=setTimeout(tick,180)};tick();
  }else msg("Scanner nicht verfügbar – bitte Nummer eintippen.");
  function found(code){try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}stopScan();lookupBarcode(code)}
}
function stopScan(){clearTimeout(scanLoop);scanLoop=null;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}const v=$("#scanVid");if(v)v.srcObject=null}
function offToFood(p,code){
  const n=p.nutriments||{};
  let kcal=+n["energy-kcal_100g"]; if(!(kcal>=0)&&n["energy_100g"])kcal=+n["energy_100g"]/4.184;
  if(!(kcal>=0)||isNaN(kcal))return null;
  const name=(p.product_name_de||p.product_name||p.generic_name||"").trim()||("Produkt "+code);
  const brand=(p.brands||"").split(",")[0].trim();
  const sq=parseFloat(p.serving_quantity);
  return{id:"o"+(code||p.code),name:brand&&!name.toLowerCase().includes(brand.toLowerCase())?`${name} (${brand})`:name,kcal:r1(kcal),p:r1(+n.proteins_100g||0),c:r1(+n.carbohydrates_100g||0),f:r1(+n.fat_100g||0),portion:sq>0&&sq<2000?sq:100,plabel:sq>0&&sq<2000?"Portion":"100 g",cat:"Produkt",ns:(p.nutriscore_grade||"").toUpperCase()};
}
/* Netzwerk: in der APK über die Android-Brücke (kein CORS), sonst fetch */
let httpSeq=0; const httpWait={};
window.__httpCb=function(id,status,body){const w=httpWait[id];if(!w)return;delete httpWait[id];clearTimeout(w.t);w.res({status,body})};
function httpGet(url){
  if(NATIVE&&NATIVE.httpGet){
    return new Promise((res,rej)=>{const id="h"+(++httpSeq);httpWait[id]={res,t:setTimeout(()=>{delete httpWait[id];rej(new Error("timeout"))},15000)};NATIVE.httpGet(id,url)})
      .then(r=>{if(r.status<=0)throw new Error("offline");return r});
  }
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),12000);
  return fetch(url,{signal:ctl.signal}).then(async r=>({status:r.status,body:await r.text()})).finally(()=>clearTimeout(t));
}
async function offFetch(url){const r=await httpGet(url);if(r.status!==200)throw new Error("http "+r.status);return JSON.parse(r.body)}
const OFF_FIELDS="code,product_name,product_name_de,generic_name,brands,nutriments,serving_quantity,nutriscore_grade";
function codeVariants(c){const v=[c];if(c.length===12)v.push("0"+c);if(c.length===13&&c[0]==="0")v.push(c.slice(1));if(c.length<13&&c.length!==8&&c.length!==12)v.push(c.padStart(13,"0"));return[...new Set(v)]}
async function offByCode(code){
  let net=false;
  for(const c of codeVariants(code)){
    try{const j=await offFetch(`${OFF}/api/v2/product/${encodeURIComponent(c)}.json?fields=${OFF_FIELDS}`);net=true;
      const f=j&&j.status===1&&j.product?offToFood(j.product,code):null; if(f)return{f,net};
      if(j&&j.status===1&&j.product)return{partial:j.product,net};
    }catch(e){if(e.message==="http 404"){net=true}}
  }
  return{net};
}
async function lookupBarcode(code){
  if(!$("#addBody"))return;
  const known=S.custom.find(f=>f.ean===code)||S.recent.find(f=>f.ean===code);
  if(known){openPortion(known);return}
  const area=$("#scanArea"); if(area)area.innerHTML=`<div class="empty"><span class="spin"></span><div style="margin-top:10px" id="lkMsg">Suche Produkt ${esc(code)} in Open Food Facts …</div></div>`;
  const r=await offByCode(code);
  if(!$("#scanArea"))return;
  if(r.f){r.f.ean=code;openPortion(r.f);return}
  if(!r.net){showNotFound(code,true,[]);return}
  // Produkt existiert ohne Nährwerte → Name als Kandidat nutzen
  const seed=[]; if(r.partial){const n=(r.partial.product_name_de||r.partial.product_name||"").trim();if(n)seed.push(((r.partial.brands||"").split(",")[0]+" "+n).trim())}
  const m=$("#lkMsg"); if(m)m.textContent=`Nicht in Open Food Facts – suche ${code} im Internet …`;
  const names=seed.concat(await webNames(code));
  if(!$("#scanArea"))return;
  if(!names.length){showNotFound(code,false,[]);return}
  showResearch(code,names);
}
/* Produktnamen zum Barcode im Internet finden */
function decodeEnt(s){const t=document.createElement("textarea");t.innerHTML=s;return t.value}
function cleanTitle(t,code){
  t=decodeEnt(t.replace(/<[^>]+>/g," ")).replace(/\s+/g," ").trim();
  t=t.split(/\s[|–—-]\s|\s·\s/)[0];
  t=t.replace(new RegExp(code+"|"+code.replace(/^0+/,""),"g")," ").replace(/\b(EAN|GTIN|UPC|Barcode|Strichcode|kaufen|online|günstig|Preisvergleich|Angebot|bei|im|Shop|Artikelnummer)\b:?/gi," ").replace(/[\s,:;()\[\]]+$/,"").replace(/^[\s,:;()\[\]-]+/,"").replace(/\s+/g," ").trim();
  return t;
}
const BAD_TITLE=/^(open food facts|ebay|amazon|google|bing|duckduckgo|codecheck|search|suche|ergebnisse|results?)$/i;
async function webNames(code){
  const jobs=[
    httpGet(`https://api.upcitemdb.com/prod/trial/lookup?upc=${code}`).then(r=>{const j=JSON.parse(r.body);return(j.items||[]).map(i=>((i.brand&&!String(i.title).toLowerCase().includes(String(i.brand).toLowerCase())?i.brand+" ":"")+i.title))}).catch(()=>[]),
    httpGet(`https://html.duckduckgo.com/html/?q=${code}&kl=de-de`).then(r=>[...r.body.matchAll(/class="result__a"[^>]*>([\s\S]*?)<\/a>/g)].map(m=>m[1])).catch(()=>[]),
    httpGet(`https://www.bing.com/search?q=${code}&setlang=de&cc=DE`).then(r=>[...r.body.matchAll(/<li class="b_algo"[\s\S]*?<h2[^>]*>\s*<a[^>]*>([\s\S]*?)<\/a>/g)].map(m=>m[1])).catch(()=>[])
  ];
  const all=(await Promise.all(jobs)).flat().map(t=>cleanTitle(String(t||""),code)).filter(t=>t.length>=4&&t.length<=90&&/[a-zäöü]{3}/i.test(t)&&!BAD_TITLE.test(t));
  // Häufig vorkommende Wörter höher gewichten
  const freq={}; all.forEach(t=>new Set(norm(t).split(/\W+/).filter(w=>w.length>2)).forEach(w=>freq[w]=(freq[w]||0)+1));
  const seen=new Set(),out=[];
  all.map(t=>({t,s:norm(t).split(/\W+/).filter(w=>w.length>2).reduce((a,w)=>a+(freq[w]>1?freq[w]:0),0)/Math.sqrt(t.length)}))
    .sort((a,b)=>b.s-a.s).forEach(({t})=>{const k=norm(t);if(!seen.has(k)){seen.add(k);out.push(t)}});
  return out.slice(0,6);
}
async function offByName(name){
  const q=name.split(/\s+/).slice(0,6).join(" ");
  try{const j=await offFetch(`${OFF}/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=12&lc=de&cc=de&fields=${OFF_FIELDS}`);return(j.products||[]).map(p=>offToFood(p,p.code)).filter(Boolean)}catch(e){return[]}
}
function localByName(name){
  const ws=norm(name).split(/\W+/).filter(w=>w.length>3);
  return allFoods().map(f=>({f,s:ws.filter(w=>norm(f.name).includes(w)).length})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,4).map(x=>x.f);
}

    <div class="grid2" style="margin-top:8px"><a class="btn ghost" style="text-align:center;text-decoration:none" href="https://www.google.com/search?q=${encodeURIComponent(name+" Nährwerte")}">Nährwerte googeln</a><button class="btn ghost" id="scanAgain">Neu scannen</button></div>`;

let onlineCache=[];
function bindOnline(){
  const go=async()=>{
    const q=$("#oq").value.trim(); if(q.length<2)return;

/* ===================== Schlaue Fasten-Benachrichtigungen ===================== */
function nset(){S.fast.notif=Object.assign({on:true,milestones:true,window:true,smart:true,qFrom:22,qTo:7},S.fast.notif||{});return S.fast.notif}
const hm=ts=>new Date(ts).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
const hfmt=h=>{const m=Math.round(h*60);return Math.floor(m/60)+" h"+(m%60?" "+pad(m%60)+" min":"")};
function inQuiet(ts){const n=nset();const h=new Date(ts).getHours()+new Date(ts).getMinutes()/60;return n.qFrom>n.qTo?(h>=n.qFrom||h<n.qTo):(h>=n.qFrom&&h<n.qTo)}
function quietEnd(ts){const n=nset();const d=new Date(ts);d.setHours(n.qTo,0,0,0);if(d.getTime()<=ts)d.setDate(d.getDate()+1);return d.getTime()}
function fastStreak(){
  const ok=new Set((S.fast.history||[]).filter(h=>h.dur>=h.goal).map(h=>dkey(new Date(h.start+h.dur*36e5))));
  let n=0,k=today(); if(!ok.has(k))k=addDays(k,-1); while(ok.has(k)){n++;k=addDays(k,-1)} return n;
}
function pick(arr){return arr[new Date().getDate()%arr.length]}
function planFastNotifs(){
  const n=nset(); if(!n.on)return[];
  const F=S.fast,H=36e5,now=Date.now(),out=[],add=(id,at,title,text,quiet="skip")=>{
    if(at<=now+30000)return; if(inQuiet(at)){if(quiet==="skip")return; if(quiet==="move"){at=quietEnd(at);title=title.replace("Ziel erreicht","Über Nacht geschafft")}}
    out.push({id,at:Math.round(at),title,text});
  };
  const hist=F.history||[]; const record=hist.reduce((m,h)=>Math.max(m,h.dur),0);
  if(F.start){
    const g=F.hours, end=F.start+g*H, streak=fastStreak()+1;
    add(101,end,`🎉 Ziel erreicht: ${g} Stunden!`,(streak>1?`${streak} Tage in Folge – stark! `:"")+pick(["Brich dein Fasten mit Eiweiß und Gemüse, nicht mit Zucker.","Starte mit etwas Leichtem: Joghurt, Eier oder eine Suppe.","Trink zuerst ein Glas Wasser und iss dann in Ruhe."])+" Tippe, um den Timer zu beenden.","move");
    if(n.milestones){
      add(102,F.start+g*H/2,"⏱️ Halbzeit!",`Noch ${hfmt(g/2)} bis zu deinem Ziel um ${hm(end)}.`);
      add(103,end-H,"💪 Noch 1 Stunde",pick(["Fast geschafft – ein Tee oder Wasser hilft gegen den Hunger.","Durchhalten! Um "+hm(end)+" hast du es geschafft."]));
      if(g>12)add(104,F.start+12*H,"🔥 12 Stunden gefastet","Dein Blutzucker ist gesunken – der Körper verbrennt jetzt verstärkt Fett.");
      if(g>16)add(105,F.start+16*H,"⚡ 16 Stunden","Die Ketose beginnt. Viel trinken – auch Salz/Elektrolyte helfen.");
      if(record>=10&&Math.abs(record-g)>0.5&&record<g+6){const at=F.start+record*H;if(Math.abs(at-end)>30*60000)add(106,at,"🏆 Neuer Rekord!",`Du fastest gerade länger als je zuvor (bisher ${hfmt(record)}).`)}
    }
    add(107,end+3*H,"Fasten noch aktiv","Dein Ziel ist seit 3 Stunden erreicht. Hast du vergessen, den Timer zu beenden?");
    return out;
  }
  // Essfenster nach dem letzten Fasten
  const last=hist[hist.length-1]; let windowPlanned=false;
  if(last&&last.dur>=4&&n.window){
    const lastEnd=last.start+last.dur*H, wEnd=lastEnd+Math.max(1,24-F.hours)*H;
    if(wEnd>now){windowPlanned=true;
      add(110,wEnd-30*60000,"🍽️ Essfenster schließt in 30 Min.",`Wenn du noch etwas essen willst, dann jetzt. Um ${hm(wEnd)} startet dein ${F.hours}:${24-F.hours}-Fasten.`);
      add(111,wEnd,"⏱️ Zeit fürs Fasten","Dein Essfenster ist vorbei. Tippe, um den Fasten-Timer zu starten.");
    }
  }
  // Smarte Erinnerung: gelernt aus deinen üblichen Startzeiten
  if(n.smart&&!windowPlanned&&hist.length>=3){
    const mins=hist.slice(-10).map(h=>{const d=new Date(h.start);return d.getHours()*60+d.getMinutes()}).sort((a,b)=>a-b);
    const med=mins[Math.floor(mins.length/2)]; const d=new Date(); d.setHours(Math.floor(med/60),med%60,0,0);
    if(d.getTime()<=now)d.setDate(d.getDate()+1);
    add(112,d.getTime(),"⏱️ Fasten starten?",`Normalerweise beginnst du um ${pad(Math.floor(med/60))}:${pad(med%60)} mit dem Fasten. Tippe, um den Timer zu starten.`);
  }
  return out;
}
let lastPlanJSON="",lastOngoing="";
function syncNotifs(){
  if(!NATIVE||!NATIVE.scheduleNotifs)return;
  try{
    const plan=JSON.stringify(planFastNotifs());
    if(plan!==lastPlanJSON){NATIVE.scheduleNotifs(plan);lastPlanJSON=plan}
    const F=S.fast,n=nset();
    const og=(F.start&&n.on)?[F.start,F.start+F.hours*36e5,`Fasten läuft · ${F.hours}:${24-F.hours}`,`Seit ${hm(F.start)} · Ziel um ${hm(F.start+F.hours*36e5)}`]:null;
    const key=JSON.stringify(og);
    if(key!==lastOngoing){if(og)NATIVE.setOngoing(String(og[0]),String(og[1]),og[2],og[3]);else NATIVE.clearOngoing();lastOngoing=key}
  }catch(e){}
}

/* ===================== KI-Fotoerkennung mit Google Gemini ===================== */
const GEM="https://generativelanguage.googleapis.com/v1beta";
function gem(){S.gemini=Object.assign({key:"",model:"",models:[]},S.gemini||{});return S.gemini}
function httpReq(method,url,headers,body){
  if(NATIVE&&NATIVE.httpRequest){
    return new Promise((res,rej)=>{const id="h"+(++httpSeq);httpWait[id]={res,t:setTimeout(()=>{delete httpWait[id];rej(new Error("timeout"))},100000)};NATIVE.httpRequest(id,method,url,JSON.stringify(headers||{}),body||null)})
      .then(r=>{if(r.status<=0)throw new Error("offline");return r});
  }
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),90000);
  return fetch(url,{method,headers,body,signal:ctl.signal}).then(async r=>({status:r.status,body:await r.text()})).finally(()=>clearTimeout(t));
}
function gemErr(r){
  let m="";try{m=JSON.parse(r.body).error.message||""}catch(e){}
  if(r.status===400&&/api key|API_KEY/i.test(m))return"Der API-Schlüssel ist ungültig. Prüfe ihn im Profil.";
  if(r.status===403)return"Zugriff verweigert – ist die Gemini API für deinen Schlüssel freigeschaltet?";
  if(r.status===429)return"Limit erreicht – zu viele Anfragen. Warte kurz und versuche es erneut.";
  if(r.status>=500)return"Gemini ist gerade überlastet. Bitte gleich nochmal versuchen.";
  return"Fehler "+r.status+(m?": "+m.slice(0,120):"");
}
/* Bestes verfügbares Flash-Modell automatisch wählen (Modelle wechseln häufig) */
function rankModels(list){
  const ok=list.filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")).map(m=>m.name.replace(/^models\//,""))
    .filter(n=>/^gemini-/.test(n)&&!/(live|tts|image|audio|embed|preview|exp|thinking|computer|robotics|transcribe|translate|banana)/.test(n));
  const ver=n=>{const v=(n.match(/gemini-(\d+(?:\.\d+)?)/)||[])[1];return v?parseFloat(v):0};
  const score=n=>(/-flash$/.test(n)?1000:/-flash-lite$/.test(n)?500:/-flash/.test(n)?300:0)+ver(n);
  return ok.filter(n=>/flash/.test(n)).sort((a,b)=>score(b)-score(a));
}
async function gemListModels(){
  const g=gem();
  const r=await httpReq("GET",`${GEM}/models?pageSize=200`,{"x-goog-api-key":g.key});
  if(r.status!==200)throw new Error(gemErr(r));
  const ranked=rankModels(JSON.parse(r.body).models||[]);
  if(!ranked.length)throw new Error("Kein passendes Gemini-Modell gefunden.");
  g.models=ranked; if(!g.model||!ranked.includes(g.model))g.model=ranked[0]; save(); return ranked;
}
async function gemGenerate(parts){
  const g=gem(); if(!g.key)throw new Error("Kein API-Schlüssel hinterlegt.");
  if(!g.models.length)await gemListModels();
  const order=[g.model].concat(g.models.filter(m=>m!==g.model)).slice(0,4);
  const body=JSON.stringify({contents:[{role:"user",parts}],generationConfig:{responseMimeType:"application/json",temperature:0.2}});
  let last=null;
  for(const m of order){
    const r=await httpReq("POST",`${GEM}/models/${m}:generateContent`,{"Content-Type":"application/json","x-goog-api-key":g.key},body);
    if(r.status===200){
      const j=JSON.parse(r.body); const c=j.candidates&&j.candidates[0];
      const txt=((c&&c.content&&c.content.parts)||[]).filter(p=>p.text&&!p.thought).map(p=>p.text).join("");
      if(!txt)throw new Error(c&&c.finishReason==="SAFETY"?"Gemini hat das Bild abgelehnt.":"Leere Antwort von Gemini.");
      if(m!==g.model){g.model=m;save()}
      return JSON.parse((txt.match(/\{[\s\S]*\}/)||[txt])[0]);
    }
    last=r;
    if(r.status===404){try{await gemListModels()}catch(e){}continue}
    if(r.status===429||r.status>=500)continue;   // nächstes Modell probieren
    break;
  }
  throw new Error(gemErr(last||{status:0,body:""}));
}

function stopCam(){if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}const v=$("#camVid");if(v)v.srcObject=null}
function shrink(file,max){
  return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);cv.toBlob(b=>b?res(b):rej(),"image/jpeg",.82)};
    img.onerror=rej;img.src=url});
}

function showAI(out,url){
  const b=$("#addBody");if(!b)return;

  aiItems=items.map(i=>{const g=Math.max(1,+i.grams||100);return{name:String(i.name).slice(0,60),grams:g,base:g,kcal:+i.kcal||0,p:+i.protein||0,c:+i.carbs||0,f:+i.fat||0,on:true}});

    <div class="card" style="margin:10px 0"><div class="stat"><div><b>${r0(tot.k)}</b><span>kcal gesamt</span></div><div><b>${r0(tot.p)} g</b><span>Eiweiß</span></div><div><b>${r0(tot.c)} / ${r0(tot.f)} g</b><span>KH / Fett</span></div></div></div>
    ${out.comment?`<div class="note" style="margin-bottom:10px">💡 ${esc(out.comment)}</div>`:""}

    b.querySelectorAll("[data-g]").forEach(inp=>inp.onchange=()=>{aiItems[+inp.dataset.g].grams=Math.max(1,parseFloat(inp.value)||1);draw()});
    b.querySelectorAll("[data-on]").forEach(cb=>cb.onchange=()=>{aiItems[+cb.dataset.on].on=cb.checked;draw()});
    $("#aiNew").onclick=()=>renderAddBody();
    $("#aiAdd").onclick=()=>{
      const sel=aiItems.filter(i=>i.on);if(!sel.length){toast("Nichts ausgewählt");return}
      sel.forEach(i=>{const s=i.grams/i.base;day(curDate).meals[addMeal].push({name:i.name,grams:i.grams,kcal:i.kcal*s,p:i.p*s,c:i.c*s,f:i.f*s,cat:"KI"})});

    };
  };
  draw();
}

function hab(){
  if(!S.habits)S.habits={list:[{id:"vape",name:"Vapen",ic:"💨"}],log:[],active:{}};
  const H=S.habits; H.list=H.list||[]; H.log=H.log||[]; H.active=H.active||{}; return H;

let habSel="vape";
const habById=id=>hab().list.find(h=>h.id===id)||{id,name:id,ic:"•"};
function durTxt(ms){const s=Math.max(0,Math.round(ms/1000));if(s<60)return s+" s";const m=Math.floor(s/60);if(m<60)return m+" min"+(s%60&&m<10?" "+s%60+" s":"");const h=Math.floor(m/60);return h+" h"+(m%60?" "+m%60+" min":"")}
function clock(ms){const s=Math.max(0,Math.floor(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+":"+pad(m):m)+":"+pad(x)}
function habLogDay(hid,k){return hab().log.filter(l=>l.h===hid&&dkey(new Date(l.start))===k)}
function habLast(hid){const H=hab();if(H.active[hid])return null;const l=H.log.filter(x=>x.h===hid);return l.length?l.reduce((a,b)=>b.end>a.end?b:a):null}
function habStart(hid){const H=hab();if(H.active[hid])return;H.active[hid]=Date.now();try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}save();render()}
function habStop(hid,at){
  const H=hab(),st=H.active[hid];if(!st)return;
  const end=Math.max(st+1000,at||Date.now()),dur=end-st;
  const commit=e=>{delete H.active[hid];H.log.push({id:"l"+Date.now().toString(36),h:hid,start:st,end:e});H.log.sort((a,b)=>a.start-b.start);save();render();toast(`${habById(hid).name}: ${durTxt(e-st)} gespeichert`)};
  try{navigator.vibrate&&navigator.vibrate([20,40,20])}catch(e){}
  if(dur>45*60000&&!at){
    openSheet("Stimmt die Dauer?",`<p style="margin-top:0;line-height:1.5">Die Session läuft seit <b>${durTxt(dur)}</b> (seit ${hm(st)}). Vielleicht vergessen zu stoppen?</p>

function habStatsHTML(){
  const H=hab(); if(!H.list.find(h=>h.id===habSel))habSel=(H.list[0]||{}).id;
  if(!habSel)return`<div class="empty">Noch keine Gewohnheit angelegt.</div><button class="btn block" data-act="hnew">+ Gewohnheit anlegen</button>`;
  const h=habById(habSel), all=H.log.filter(l=>l.h===habSel), now=Date.now();
  const chips=H.list.length>1?`<div class="chips">${H.list.map(x=>`<button class="chip ${x.id===habSel?"on":""}" data-hsel="${x.id}">${x.ic} ${esc(x.name)}</button>`).join("")}</div>`:"";
  const days=[];for(let i=6;i>=0;i--)days.push(addDays(today(),-i));
  const per=days.map(k=>{const l=habLogDay(habSel,k);return{n:l.length,ms:l.reduce((a,x)=>a+x.end-x.start,0)}});
  const t=per[6],y=per[5],week=per.reduce((a,p)=>({n:a.n+p.n,ms:a.ms+p.ms}),{n:0,ms:0});
  const avgDur=all.length?all.reduce((a,l)=>a+l.end-l.start,0)/all.length:0;
  const last=habLast(habSel), act=H.active[habSel];
  const diff=(a,b,f)=>{if(!b)return"";const d=a-b;return`<div class="small" style="color:var(--muted)">${d===0?"wie gestern":(d>0?"+":"−")+f(Math.abs(d))+" ggü. gestern"}</div>`};
  // 7-Tage-Balken (Minuten)
  const W=340,Hh=150,pb=22,max=Math.max(1,...per.map(p=>p.ms/60000)),bw=W/7*.56;
  let bars="";per.forEach((p,i)=>{const m=p.ms/60000,x=W/7*i+(W/7-bw)/2,hh=(Hh-pb-16)*m/max,yy=Hh-pb-hh;

const TITLES=[[1,'Einsteiger'],[3,'Aufsteiger'],[6,'Sportler'],[10,'Athlet'],[15,'Krieger'],[20,'Champion'],[30,'Legende']];
function levelInfo(xp){
  let lv=1,base=0,need=100;
  while(xp>=base+need){base+=need;lv++;need=100+(lv-1)*50;}
  let title=TITLES[0][1]; for(const [l,t] of TITLES) if(lv>=l) title=t;
  return {lv,into:xp-base,need,title,pct:Math.min(100,(xp-base)/need*100)};
}
function stats(){
  const r={n:F.sessions.length,reps:0,push:0,abs:0,vol:0,plank:0,early:0,night:0,long:0,minutes:0};
  for(const s of F.sessions){
    const h=new Date(s.start).getHours();
    if(h<7) r.early=1; if(h>=22) r.night=1;
    const dur=(s.end-s.start)/60000; r.minutes+=dur; if(dur>=45) r.long=1;
    for(const en of s.entries){ const t=getEx(en.ex).type;
      for(const st of en.sets){
        if(t==='time'){ if(en.ex==='planke'||en.ex==='seitstuetz') r.plank=Math.max(r.plank,st.sec); continue; }
        r.reps+=st.reps;
        if(en.ex==='liegestuetze') r.push+=st.reps;
        if(en.ex==='situps'||en.ex==='crunches') r.abs+=st.reps;
        if(t==='weight') r.vol+=st.reps*st.weight;
      }}
  }
  const days=new Set(F.sessions.map(s=>dayKey(s.start)));
  let cur=0,d=new Date(); d.setHours(12);
  if(!days.has(dayKey(d))) d.setDate(d.getDate()-1);
  while(days.has(dayKey(d))){cur++;d.setDate(d.getDate()-1);}
  // beste Serie
  let best=0; const sorted=[...days].map(k=>{const [y,m,dd]=k.split('-');return new Date(+y,m-1,+dd,12).getTime()}).sort((a,b)=>a-b);
  let run=0,prev=null; for(const t of sorted){ run=(prev&&Math.round((t-prev)/864e5)===1)?run+1:1; best=Math.max(best,run); prev=t; }
  r.streak=cur; r.bestStreak=best;
  const mon=new Date(); mon.setHours(0,0,0,0); mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  r.week=F.sessions.filter(s=>s.start>=mon.getTime()).length;
  r.prs=F.prCount||0; r.own=F.createdOwn?1:0;
  return r;
}

function isPR(t,rec,st){
  if(!rec) return false;
  if(t==='time') return st.sec>rec.sec;
  if(t==='weight') return st.weight>rec.weight||(st.weight===rec.weight&&st.reps>rec.wreps);
  return st.reps>rec.reps;
}
function updateRec(t,exId,st){
  const r=F.records[exId]||(F.records[exId]={reps:0,sec:0,weight:0,wreps:0});
  r.reps=Math.max(r.reps,st.reps||0); r.sec=Math.max(r.sec,st.sec||0);
  if(t==='weight'&&(st.weight>r.weight||(st.weight===r.weight&&st.reps>r.wreps))){r.weight=st.weight;r.wreps=st.reps;}
}
function setXP(t,st){
  if(t==='time') return st.sec/3;
  if(t==='weight') return st.reps+st.reps*st.weight/20;

}

    html+=`<div class="banner" onclick="go('session')"><div class="grow">Training läuft: ${esc(a.name)}<div class="sub">${done} Sätze erledigt · tippen zum Fortsetzen</div></div>${IC.play}</div>`;
  }
  html+=`<h3>Deine Trainings</h3>`;
  if(!F.workouts.length) html+=`<div class="empty"><div class="e">🏁</div>Noch keine Trainings. Leg dein erstes an!</div>`;
  for(const w of F.workouts){
    const names=w.items.map(i=>getEx(i.ex).name).join(' · ')||'Keine Übungen';
    const sets=w.items.reduce((n,i)=>n+i.sets,0);
    html+=`<div class="card wo"><div class="grow" onclick="editWorkout('${w.id}')">
      <div class="name">${esc(w.name)}</div><div class="ex">${esc(names)}</div>

  }
  html+=`<button class="btn acc wide" onclick="editWorkout()">+ Neues Training</button>
    <button class="btn wide" onclick="startWorkout()">Freies Training starten</button></div>`;
  return html;
}

let draft=null;

function mvItem(i,d){const a=draft.items,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];fitRender(true);}
function rmItem(i){draft.items.splice(i,1);fitRender(true);}
function saveWorkout(){
  if(!draft.name.trim()) draft.name='Mein Training';
  if(draft.id){ const i=F.workouts.findIndex(w=>w.id===draft.id); F.workouts[i]=draft; }
  else { draft.id=uid(); F.workouts.push(draft); F.createdOwn=true; }

}
function delWorkout(){

}

/* ---------- Stepper ---------- */
function stepper(k,f,val,step,unit,dec){
  return `<div class="step"><button class="stb" ${k} data-f="${f}" data-d="-${step}">−</button>
   <div class="sv"><input ${k} data-f="${f}" value="${fmt(val)}" inputmode="${dec?'decimal':'numeric'}" onfocus="this.select()" oninput="onIn(this)">${unit?`<small>${unit}</small>`:''}</div>
   <button class="stb" ${k} data-f="${f}" data-d="${step}">+</button></div>`;
}
function setVal(el,val){
  const {k,e,s,f}=el.dataset;
  if(k==='d'){ draft.items[e][f]=f==='sets'?Math.max(1,Math.round(val)):val; }
  else if(k==='s'&&F.active){ F.active.entries[e].sets[s][f]=val; fitSave(); }
}
function onIn(inp){ setVal(inp,Math.max(0,num(inp.value))); }
function bump(btn){
  const inp=btn.parentElement.querySelector('input');
  const d=num(btn.dataset.d);
  let v=Math.max(btn.dataset.f==='sets'?1:0,Math.round((num(inp.value)+d)*100)/100);
  inp.value=fmt(v); setVal(inp,v); vib(8);
}
let holdT=null,holdI=null,holdB=null,held=false;
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.stb'); if(!b) return;
  holdB=b; held=false;
  holdT=setTimeout(()=>{held=true;bump(b);holdI=setInterval(()=>bump(b),75)},380);
});
document.addEventListener('pointerup',e=>{
  clearTimeout(holdT);clearInterval(holdI);
  if(holdB&&!held&&e.target.closest('.stb')===holdB) bump(holdB);
  holdB=null;
});
document.addEventListener('pointercancel',()=>{clearTimeout(holdT);clearInterval(holdI);holdB=null;});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.stb'))e.preventDefault();});

/* ---------- Übungsauswahl ---------- */
let pickTarget='edit',newType='reps';
function openPicker(target){ pickTarget=target; newType='reps'; showModal(pickerHTML('')); }
function pickerHTML(q){
  const list=F.exercises.filter(e=>e.name.toLowerCase().includes(q.toLowerCase()));

function pickList(q){
  const list=F.exercises.filter(e=>e.name.toLowerCase().includes(q.toLowerCase()));

function segHTML(){return Object.entries(TYPES).map(([k,l])=>`<button class="${newType===k?'on':''}" onclick="newType='${k}';document.getElementById('seg').innerHTML=segHTML()">${l}</button>`).join('');}
function createEx(){

function pickEx(id){
  const t=getEx(id).type, tgt=t==='time'?30:10, w=t==='weight'?20:0;
  if(pickTarget==='edit') draft.items.push({ex:id,sets:3,target:tgt,weight:w});
  else { const last=lastEntry(id);
    const sets=last?last.sets.map(s=>({reps:s.reps,weight:s.weight,sec:s.sec,done:false})):[0,1,2].map(()=>({reps:tgt,weight:w,sec:tgt,done:false}));
