/* ---------- Firestore-Werte umwandeln ---------- */
function toV(v){
  if(v===null||v===undefined)return{nullValue:null};
  if(typeof v==="boolean")return{booleanValue:v};
  if(typeof v==="number")return Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};
  if(typeof v==="string")return{stringValue:v};
  if(Array.isArray(v))return{arrayValue:{values:v.map(toV)}};
  const f={};Object.keys(v).forEach(k=>f[k]=toV(v[k]));return{mapValue:{fields:f}};
}
function fromV(v){
  if(!v)return null;
  if("stringValue" in v)return v.stringValue; if("integerValue" in v)return parseInt(v.integerValue,10);
  if("doubleValue" in v)return v.doubleValue; if("booleanValue" in v)return v.booleanValue; if("nullValue" in v)return null;
  if("timestampValue" in v)return v.timestampValue;
  if("arrayValue" in v)return(v.arrayValue.values||[]).map(fromV);
  if("mapValue" in v){const o={},f=v.mapValue.fields||{};Object.keys(f).forEach(k=>o[k]=fromV(f[k]));return o}
  return null;
}
const fieldsOf=o=>{const f={};Object.keys(o).forEach(k=>f[k]=toV(o[k]));return f};
const docObj=d=>{const o={};Object.keys(d.fields||{}).forEach(k=>o[k]=fromV(d.fields[k]));return o};

/* ---------- Anmeldung (Firebase Auth REST) ---------- */
function authMsg(m){
  const t={EMAIL_EXISTS:"Diese E-Mail ist schon registriert – melde dich an.",EMAIL_NOT_FOUND:"Kein Konto mit dieser E-Mail.",INVALID_PASSWORD:"Falsches Passwort.",INVALID_LOGIN_CREDENTIALS:"E-Mail oder Passwort falsch.",
    INVALID_EMAIL:"Ungültige E-Mail-Adresse.",USER_DISABLED:"Dieses Konto ist gesperrt.",TOO_MANY_ATTEMPTS_TRY_LATER:"Zu viele Versuche – bitte später erneut.",OPERATION_NOT_ALLOWED:"E-Mail-Anmeldung ist im Firebase-Projekt nicht aktiviert.",
    CONFIGURATION_NOT_FOUND:"Firebase-Authentifizierung ist im Projekt noch nicht eingerichtet.","API key not valid. Please pass a valid API key.":"Der Firebase-Schlüssel ist ungültig."};
  const key=String(m||"").split(" : ")[0].trim();
  if(/^WEAK_PASSWORD/.test(key))return"Passwort zu schwach – mindestens 6 Zeichen.";
  return t[key]||t[m]||("Fehler: "+m);
}
async function authCall(path,body){
  const r=await httpReq("POST",`https://identitytoolkit.googleapis.com/v1/accounts:${path}?key=${encodeURIComponent(SY.cfg.apiKey)}`,{"Content-Type":"application/json"},JSON.stringify(body));
  let j={};try{j=JSON.parse(r.body)}catch(e){}
  if(r.status!==200)throw new Error(authMsg(j.error&&j.error.message||("HTTP "+r.status)));
  return j;
}
function setAuth(j,email){SY.auth={uid:j.localId||j.user_id,email:email||j.email||(SY.auth&&SY.auth.email),refresh:j.refreshToken||j.refresh_token,id:j.idToken||j.id_token,exp:Date.now()+((+j.expiresIn||+j.expires_in||3600)-120)*1000};saveSY()}
async function idToken(){
  if(!loggedIn())throw new Error("nicht angemeldet");
  if(SY.auth.id&&SY.auth.exp>Date.now())return SY.auth.id;
  const r=await httpReq("POST",`https://securetoken.googleapis.com/v1/token?key=${encodeURIComponent(SY.cfg.apiKey)}`,{"Content-Type":"application/x-www-form-urlencoded"},"grant_type=refresh_token&refresh_token="+encodeURIComponent(SY.auth.refresh));
  let j={};try{j=JSON.parse(r.body)}catch(e){}
  if(r.status!==200){const m=j.error&&j.error.message||"";if(/TOKEN_EXPIRED|USER_NOT_FOUND|INVALID_REFRESH_TOKEN|USER_DISABLED/.test(m)){SY.auth=null;saveSY();throw new Error("Bitte melde dich erneut an.")}throw new Error("offline")}
  setAuth(j); return SY.auth.id;
}
async function signUp(name,email,pw){
  const j=await authCall("signUp",{email,password:pw,returnSecureToken:true});
  setAuth(j,email); SY.name=name||email.split("@")[0]; SY.meta={hash:{},u:{},pp:{},pd:0,fresh:true}; saveSY();
  try{await authCall("update",{idToken:j.idToken,displayName:SY.name,returnSecureToken:false})}catch(e){}
  await fsPatch(`users/${SY.auth.uid}`,{name:SY.name,email,fid:""});
  markAllDirty(); await syncNow(true);
}
async function signIn(email,pw){
  const j=await authCall("signInWithPassword",{email,password:pw,returnSecureToken:true});
  setAuth(j,email); SY.name=j.displayName||email.split("@")[0]; SY.meta={hash:{},u:{},pp:{},pd:0,fresh:true}; saveSY();
  try{const u=await fsGet(`users/${SY.auth.uid}`);if(u){if(u.name)SY.name=u.name;if(u.fid)await loadFamily(u.fid)}}catch(e){}
  markAllDirty(); await syncNow(true);
}
function signOut(){SY.auth=null;SY.family=null;SY.meta={hash:{},u:{},pp:{},pd:0};SY.status="";saveSY();render();toast("Abgemeldet – deine Daten bleiben auf dem Gerät")}

/* ---------- Firestore REST ---------- */
const fsBase=()=>`https://firestore.googleapis.com/v1/projects/${SY.cfg.projectId}/databases/(default)/documents`;
const fsName=p=>`projects/${SY.cfg.projectId}/databases/(default)/documents/${p}`;
async function fsReq(method,url,body){
  const tok=await idToken();
  const r=await httpReq(method,url,{"Content-Type":"application/json","Authorization":"Bearer "+tok},body?JSON.stringify(body):null);
  if(r.status===401){SY.auth.id="";SY.auth.exp=0}
  return r;
}
function fsErr(r){let m="";try{m=JSON.parse(r.body).error.message}catch(e){}
  if(r.status===403)return"Keine Berechtigung"+(m?" ("+m+")":"")+". Sind die Sicherheitsregeln eingetragen?";
  if(r.status===404&&/database/i.test(m))return"Firestore-Datenbank fehlt im Firebase-Projekt.";
  return"Firestore-Fehler "+r.status+(m?": "+m:"")}
async function fsGet(path){const r=await fsReq("GET",`${fsBase()}/${path}`);if(r.status===404)return null;if(r.status!==200)throw new Error(fsErr(r));return docObj(JSON.parse(r.body))}
async function fsPatch(path,obj){const r=await fsReq("PATCH",`${fsBase()}/${path}?${Object.keys(obj).map(k=>"updateMask.fieldPaths="+encodeURIComponent(k)).join("&")}`,{fields:fieldsOf(obj)});if(r.status!==200)throw new Error(fsErr(r))}
async function fsCommit(writes){if(!writes.length)return;for(let i=0;i<writes.length;i+=400){const r=await fsReq("POST",`${fsBase()}:commit`,{writes:writes.slice(i,i+400)});if(r.status!==200)throw new Error(fsErr(r))}}
async function fsChanged(parent,coll,since){
  const r=await fsReq("POST",`${fsBase()}${parent?"/"+parent:""}:runQuery`,{structuredQuery:{from:[{collectionId:coll}],where:{fieldFilter:{field:{fieldPath:"u"},op:"GREATER_THAN",value:{integerValue:String(Math.max(0,since))}}}}});
  if(r.status!==200)throw new Error(fsErr(r));
  return(JSON.parse(r.body)||[]).filter(x=>x.document).map(x=>({id:x.document.name.split("/").pop(),...docObj(x.document)}));
}
const recWrite=(path,d,u)=>({update:{name:fsName(path),fields:fieldsOf({d,u,by:SY.name||""})}});

/* ---------- Was wird synchronisiert? ---------- */
function hashStr(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return(h>>>0).toString(36)+"."+s.length}
function personalChunks(){
  const core=Object.assign({},S); delete core.days; delete core.lastUpdCheck; delete core.skipVersion;
  core.gemini=Object.assign({},S.gemini||{}); delete core.gemini.key; // API-Schlüssel bleibt auf dem Gerät
  const out={core:JSON.stringify(core),fit:JSON.stringify(F)};
  const months={};Object.keys(S.days||{}).forEach(k=>{const m="m-"+k.slice(0,7);(months[m]=months[m]||{})[k]=S.days[k]});
  Object.keys(months).forEach(m=>out[m]=JSON.stringify(months[m]));
  return out;
}
function applyChunk(name,json){
  const v=JSON.parse(json);
  if(name==="core"){const keep={days:S.days,gemini:S.gemini,lastUpdCheck:S.lastUpdCheck,skipVersion:S.skipVersion};S=Object.assign(blank(),v);S.days=keep.days||{};S.gemini=Object.assign({},v.gemini||{},{key:keep.gemini&&keep.gemini.key||""});S.lastUpdCheck=keep.lastUpdCheck;S.skipVersion=keep.skipVersion}
  else if(name==="fit"){F=v;load2();fitSave(true)}
  else if(name.startsWith("m-")){const mon=name.slice(2);Object.keys(S.days).filter(k=>k.startsWith(mon)).forEach(k=>delete S.days[k]);Object.assign(S.days,v)}
}
const plannerBase=()=>SY.family?`families/${SY.family.id}`:`users/${SY.auth.uid}`;
function markAllDirty(){["recipes","plan","shop"].forEach(c=>Object.keys(P[c]).forEach(id=>{P[c][id].u=P[c][id].u||Date.now();P.dirty[c+"/"+id]=1}));saveP();SY.meta.pp={};saveSY()}

/* ---------- Synchronisieren ---------- */
let syncing=false,pushTimer=null,pollTimer=null,syncAgain=false;
function schedulePush(){if(!loggedIn())return;clearTimeout(pushTimer);pushTimer=setTimeout(()=>syncNow(),1500)}
function syncSoon(){schedulePush()}
async function syncNow(manual){
  if(!loggedIn())return;
  if(syncing){syncAgain=true;return}
  syncing=true; SY.status="sync"; updSyncBadge();
  let changed=false;
  try{
    // 1) Familie aktuell halten
    if(SY.family){try{await loadFamily(SY.family.id)}catch(e){if(/Berechtigung/.test(e.message)){SY.family=null;markAllDirty();toast("Du bist nicht mehr in der Familie")}else throw e}}
    const uid=SY.auth.uid, fresh=!!SY.meta.fresh;
    // 2) Persönliche Daten: erst holen (bei neuer Anmeldung gewinnt die Cloud), dann eigene Änderungen hochladen
    const rem=await fsChanged(`users/${uid}`,"data",fresh?0:(SY.meta.pd||0)-120000);
    rem.sort((a,b)=>a.u-b.u).forEach(d=>{
      if(!d.d||d.u<=(SY.meta.u[d.id]||0))return;
      const localJ=personalChunks()[d.id], dirty=localJ!==undefined&&hashStr(localJ)!==SY.meta.hash[d.id];
      if(dirty&&!fresh&&(SY.meta.u[d.id]||0)>0)return; // lokale Änderung gewinnt, wird gleich hochgeladen
      applyChunk(d.id,d.d); SY.meta.hash[d.id]=hashStr(d.d); SY.meta.u[d.id]=d.u; SY.meta.pd=Math.max(SY.meta.pd||0,d.u); changed=true;
    });
    if(changed){syncNow.applying=true;save();syncNow.applying=false}
    // Nach dem Übernehmen Hashes neu berechnen (Formatierung kann abweichen)
    const ch=personalChunks(), writes=[], now=Date.now();
    Object.keys(ch).forEach(n=>{const h=hashStr(ch[n]);if(h!==SY.meta.hash[n]){writes.push(recWrite(`users/${uid}/data/${n}`,ch[n],now));SY.meta.hash[n]=h;SY.meta.u[n]=now}});
    await fsCommit(writes); SY.meta.fresh=false;
    // 3) Planer (Familie oder persönlich): Änderungen hochladen …
    const base=plannerBase(), pw=[];
    Object.keys(P.dirty).forEach(key=>{const[c,id]=key.split("/");const rec=P[c]&&P[c][id];if(rec)pw.push(recWrite(`${base}/${c}/${id}`,JSON.stringify(rec),rec.u||now))});
    const sent=Object.keys(P.dirty); await fsCommit(pw); sent.forEach(k=>delete P.dirty[k]);
    // … und Änderungen der anderen holen
    for(const c of ["recipes","plan","shop"]){
      const docs=await fsChanged(base,c,(SY.meta.pp[c]||0)-120000);
      docs.forEach(d=>{let rec;try{rec=JSON.parse(d.d)}catch(e){return}
        const loc=P[c][d.id]; if(!loc||(rec.u||0)>(loc.u||0)){if(!(P.dirty[c+"/"+d.id]&&loc&&(loc.u||0)>=(rec.u||0))){P[c][d.id]=rec;changed=true}}
        SY.meta.pp[c]=Math.max(SY.meta.pp[c]||0,d.u||0)});
    }
    // alte Löschmarken aufräumen
    ["recipes","plan","shop"].forEach(c=>Object.keys(P[c]).forEach(id=>{const r=P[c][id];if(r&&r.del&&(r.u||0)<Date.now()-30*864e5&&!P.dirty[c+"/"+id])delete P[c][id]}));
    saveP(); SY.status="ok"; SY.last=Date.now(); SY.err="";
    if(manual===true)toast("☁️ Synchronisiert");
  }catch(e){
    SY.status=e.message==="offline"||e.message==="timeout"?"offline":"error"; SY.err=e.message;
    if(manual===true)toast(SY.status==="offline"?"Keine Verbindung – wird später synchronisiert":e.message);
  }finally{
    syncing=false; saveSY(); updSyncBadge();
    if(changed&&canRerender()){const fid=document.activeElement&&document.activeElement.id;render();if(fid){const el=document.getElementById(fid);if(el)el.focus()}}
    if(syncAgain){syncAgain=false;setTimeout(()=>syncNow(),300)}
  }
}
function canRerender(){const a=document.activeElement;return!$("#scrim").classList.contains("open")&&!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.value)&&["today","plan","stats","profile","fast"].includes(tab)}
function startPolling(){clearInterval(pollTimer);pollTimer=setInterval(()=>{if(!document.hidden&&loggedIn())syncNow()},25000)}
function syncBadgeHTML(){if(!loggedIn())return"";const ic={sync:"🔄",ok:"☁️",offline:"📴",error:"⚠️"}[SY.status]||"☁️";return`<span id="syncBadge" class="syncb" data-act="syncnow" title="Synchronisieren">${ic}</span>`}
function updSyncBadge(){const b=$("#syncBadge");if(b)b.textContent={sync:"🔄",ok:"☁️",offline:"📴",error:"⚠️"}[SY.status]||"☁️"}

const CODE_CH="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const newCode=()=>[...Array(6)].map(()=>CODE_CH[Math.floor(Math.random()*CODE_CH.length)]).join("");
async function loadFamily(fid){const f=await fsGet(`families/${fid}`);if(!f)throw new Error("Familie nicht gefunden");SY.family={id:fid,...f};saveSY();return SY.family}
async function createFamily(name){
  const uid=SY.auth.uid, fid="f"+uid2()+uid.slice(0,4), code=newCode();
  await fsCommit([{update:{name:fsName(`families/${fid}`),fields:fieldsOf({name,owner:uid,members:[uid],memberInfo:{[uid]:{name:SY.name,email:SY.auth.email}},invite:code,createdAt:Date.now()})},currentDocument:{exists:false}}]);
  await fsCommit([{update:{name:fsName(`invites/${code}`),fields:fieldsOf({fid,by:uid,at:Date.now()})}}]);
  await fsPatch(`users/${uid}`,{fid}); await loadFamily(fid); markAllDirty(); await syncNow();
}
async function joinFamily(code){
  code=code.trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
  const inv=await fsGet(`invites/${code}`); if(!inv||!inv.fid)throw new Error("Code ungültig.");
  const uid=SY.auth.uid;
  await fsCommit([{update:{name:fsName(`families/${inv.fid}`),fields:fieldsOf({joinCode:code,memberInfo:{[uid]:{name:SY.name,email:SY.auth.email}}})},
    updateMask:{fieldPaths:["joinCode","memberInfo.`"+uid+"`"]},updateTransforms:[{fieldPath:"members",appendMissingElements:{values:[{stringValue:uid}]}}],currentDocument:{exists:true}}]);
  await fsPatch(`users/${uid}`,{fid:inv.fid}); await loadFamily(inv.fid); markAllDirty(); await syncNow();
}
async function leaveFamily(){
  const f=SY.family,uid=SY.auth.uid; if(!f)return;
  if((f.members||[]).length<=1&&f.owner===uid){await fsCommit([{delete:fsName(`families/${f.id}`)}].concat(f.invite?[{delete:fsName(`invites/${f.invite}`)}]:[]))}
  else await fsCommit([{update:{name:fsName(`families/${f.id}`),fields:{}},updateMask:{fieldPaths:["memberInfo.`"+uid+"`"]},updateTransforms:[{fieldPath:"members",removeAllFromArray:{values:[{stringValue:uid}]}}]}]);
  await fsPatch(`users/${uid}`,{fid:""}); SY.family=null; saveSY(); markAllDirty(); await syncNow();
}
const joinKey=()=>"NF1."+btoa(JSON.stringify({p:SY.cfg.projectId,k:SY.cfg.apiKey,c:SY.family&&SY.family.invite||""})).replace(/=+$/,"");
function parseJoinKey(t){const m=String(t).match(/NF1\.([A-Za-z0-9+/_-]+)/);if(!m)return null;try{const o=JSON.parse(atob(m[1].replace(/-/g,"+").replace(/_/g,"/")));return o&&o.p&&o.k?o:null}catch(e){return null}}
function parseFirebaseConfig(t){
  const k=(String(t).match(/apiKey["']?\s*[:=]\s*["']([^"']+)/)||[])[1], p=(String(t).match(/projectId["']?\s*[:=]\s*["']([^"']+)/)||[])[1];
  if(k&&p)return{apiKey:k,projectId:p}; const jk=parseJoinKey(t); return jk?{apiKey:jk.k,projectId:jk.p,code:jk.c}:null;
}

function cloudClick(b){
  const a=b.dataset.act;
  if(a==="cloudsetup"){openCloudSetup();return true}
  if(a==="login"){openLogin(false);return true}
  if(a==="register"){openLogin(true);return true}
  if(a==="logout"){signOut();return true}
  if(a==="syncnow"){syncNow(true).then(()=>{if(tab==="profile")render()});return true}
  if(a==="famnew"){openFamNew();return true}
  if(a==="famjoin"){openFamJoin();return true}
  if(a==="famshare"){openFamShare();return true}
  if(a==="famleave"){if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="Wirklich verlassen?";return true}leaveFamily().then(()=>{render();toast("Familie verlassen")}).catch(e=>toast(e.message));return true}
  return false;
}

function hab(){
  if(!S.habits)S.habits={list:[{id:"vape",name:"Vapen",ic:"💨"}],log:[],active:{}};
  const H=S.habits; H.list=H.list||[]; H.log=H.log||[]; H.active=H.active||{}; return H;
}
let habSel="vape";
const habById=id=>hab().list.find(h=>h.id===id)||{id,name:id,ic:"•"};
function durTxt(ms){const s=Math.max(0,Math.round(ms/1000));if(s<60)return s+" s";const m=Math.floor(s/60);if(m<60)return m+" min"+(s%60&&m<10?" "+s%60+" s":"");const h=Math.floor(m/60);return h+" h"+(m%60?" "+m%60+" min":"")}
function clock(ms){const s=Math.max(0,Math.floor(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+":"+pad(m):m)+":"+pad(x)}
function habLogDay(hid,k){return hab().log.filter(l=>l.h===hid&&dkey(new Date(l.start))===k)}
function habLast(hid){const H=hab();if(H.active[hid])return null;const l=H.log.filter(x=>x.h===hid);return l.length?l.reduce((a,b)=>b.end>a.end?b:a):null}
function habStart(hid){const H=hab();if(H.active[hid])return;H.active[hid]=Date.now();try{navigator.vibrate&&navigator.vibrate(30)}catch(e){}save();render()}
function habStop(hid,at){
  const H=hab(),st=H.active[hid];if(!st)return;
  const end=Math.max(st+1000,at||Date.now()),dur=end-st;
  const commit=e=>{delete H.active[hid];H.log.push({id:"l"+Date.now().toString(36),h:hid,start:st,end:e});H.log.sort((a,b)=>a.start-b.start);save();render();toast(`${habById(hid).name}: ${durTxt(e-st)} gespeichert`)};
  try{navigator.vibrate&&navigator.vibrate([20,40,20])}catch(e){}
  if(dur>45*60000&&!at){
    openSheet("Stimmt die Dauer?",`<p style="margin-top:0;line-height:1.5">Die Session läuft seit <b>${durTxt(dur)}</b> (seit ${hm(st)}). Vielleicht vergessen zu stoppen?</p>
      <label class="field"><span>Tatsächliche Dauer (Minuten)</span><input class="inp" id="hFix" type="number" inputmode="numeric" value="5"></label>
      <div class="grid2"><button class="btn ghost" id="hKeep">${durTxt(dur)} behalten</button><button class="btn" id="hSave">Korrigieren</button></div>`,()=>{
        $("#hKeep").onclick=()=>{closeSheet();commit(end)};
        $("#hSave").onclick=()=>{const m=parseFloat($("#hFix").value);if(!(m>0)){toast("Minuten eingeben");return}closeSheet();commit(st+m*60000)};
      });
    return;
  }
  commit(end);
}

  return`<div class="card"><h3>🔁 Gewohnheiten <button class="btn sec" style="padding:6px 11px;font-size:12.5px" data-act="habstats">Auswertung</button></h3>${H.list.map(h=>{
    const act=H.active[h.id], ls=habLogDay(h.id,curDate), tot=ls.reduce((a,l)=>a+l.end-l.start,0), last=habLast(h.id);
    const info=`${ls.length}× · ${durTxt(tot)}${isToday&&last?` · zuletzt vor <span data-hsince="${last.end}">${durTxt(Date.now()-last.end)}</span>`:""}`;
    return`<div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><span style="font-size:26px;width:38px;text-align:center">${h.ic}</span>

           :`<button class="btn habbtn" data-act="hstart" data-h="${h.id}">▶ Start</button>`}</div>`}).join("")}</div>`;
}
function habStatsHTML(){
  const H=hab(); if(!H.list.find(h=>h.id===habSel))habSel=(H.list[0]||{}).id;
  if(!habSel)return`<div class="empty">Noch keine Gewohnheit angelegt.</div><button class="btn block" data-act="hnew">+ Gewohnheit anlegen</button>`;
  const h=habById(habSel), all=H.log.filter(l=>l.h===habSel), now=Date.now();
  const chips=H.list.length>1?`<div class="chips">${H.list.map(x=>`<button class="chip ${x.id===habSel?"on":""}" data-hsel="${x.id}">${x.ic} ${esc(x.name)}</button>`).join("")}</div>`:"";
  const days=[];for(let i=6;i>=0;i--)days.push(addDays(today(),-i));
  const per=days.map(k=>{const l=habLogDay(habSel,k);return{n:l.length,ms:l.reduce((a,x)=>a+x.end-x.start,0)}});
  const t=per[6],y=per[5],week=per.reduce((a,p)=>({n:a.n+p.n,ms:a.ms+p.ms}),{n:0,ms:0});
  const avgDur=all.length?all.reduce((a,l)=>a+l.end-l.start,0)/all.length:0;
  const last=habLast(habSel), act=H.active[habSel];
  const diff=(a,b,f)=>{if(!b)return"";const d=a-b;return`<div class="small" style="color:var(--muted)">${d===0?"wie gestern":(d>0?"+":"−")+f(Math.abs(d))+" ggü. gestern"}</div>`};
  // 7-Tage-Balken (Minuten)
  const W=340,Hh=150,pb=22,max=Math.max(1,...per.map(p=>p.ms/60000)),bw=W/7*.56;
  let bars="";per.forEach((p,i)=>{const m=p.ms/60000,x=W/7*i+(W/7-bw)/2,hh=(Hh-pb-16)*m/max,yy=Hh-pb-hh;
    bars+=`<rect x="${x}" y="${yy}" width="${bw}" height="${Math.max(0,hh)}" rx="5" fill="var(--brand)" opacity="${i===6?1:.7}"/>${p.n?`<text x="${x+bw/2}" y="${yy-4}" text-anchor="middle">${p.n}×</text>`:""}<text x="${x+bw/2}" y="${Hh-6}" text-anchor="middle">${new Date(days[i]+"T12:00").toLocaleDateString("de-DE",{weekday:"short"})}</text>`});
  // Tageszeiten (letzte 30 Tage)
  const from=now-30*864e5, hours=Array(24).fill(0); all.filter(l=>l.start>=from).forEach(l=>hours[new Date(l.start).getHours()]++);
  const hm2=Math.max(1,...hours); let hb="";hours.forEach((n,i)=>{const x=i*(W/24)+1,hh=(Hh-pb-8)*n/hm2;hb+=`<rect x="${x}" y="${Hh-pb-hh}" width="${W/24-2}" height="${Math.max(0,hh)}" rx="2" fill="var(--brand2)"/>${i%3===0?`<text x="${x+(W/24-2)/2}" y="${Hh-6}" text-anchor="middle">${i}</text>`:""}`});
  const peak=hours.indexOf(hm2);
  // Verlauf (14 Tage)
  const groups={};all.filter(l=>l.start>=now-14*864e5).slice().reverse().forEach(l=>{const k=dkey(new Date(l.start));(groups[k]=groups[k]||[]).push(l)});
  const hist=Object.keys(groups).map(k=>`<div class="muted small" style="font-weight:700;margin:12px 2px 4px">${niceDate(k)} · ${groups[k].length}× · ${durTxt(groups[k].reduce((a,l)=>a+l.end-l.start,0))}</div>`+groups[k].map(l=>`<div class="item" style="padding:6px 2px"><div class="n"><div>${hm(l.start)} – ${hm(l.end)}</div></div><span class="k">${durTxt(l.end-l.start)}</span><button class="x" data-hdel="${l.id}" aria-label="Löschen">×</button></div>`).join("")).join("");
  return chips+`
  <div class="card" style="text-align:center">
    ${act?`<div class="muted small">läuft seit ${hm(act)}</div><div style="font-size:34px;font-weight:800;margin:4px 0 10px" data-hlive="${act}">${clock(now-act)}</div><button class="btn danger block" data-act="hstop" data-h="${habSel}">■ Stopp</button>`
         :`<div class="muted small">${last?"Zeit seit der letzten Session":"Noch keine Session erfasst"}</div><div style="font-size:30px;font-weight:800;margin:4px 0 10px">${last?`<span data-hsince="${last.end}">${durTxt(now-last.end)}</span>`:"–"}</div><button class="btn block" data-act="hstart" data-h="${habSel}">▶ ${esc(h.name)} starten</button>`}
  </div>
  <div class="card"><div class="stat"><div><b>${t.n}×</b><span>heute</span>${diff(t.n,y.n||0.0001,v=>Math.round(v))}</div><div><b>${durTxt(t.ms)}</b><span>Dauer heute</span>${diff(t.ms,y.ms||0.0001,durTxt)}</div><div><b>${durTxt(avgDur)}</b><span>Ø pro Session</span></div></div>
    <div class="stat" style="margin-top:12px"><div><b>${r1(week.n/7).toString().replace(".",",")}×</b><span>Ø pro Tag (7 T.)</span></div><div><b>${durTxt(week.ms/7)}</b><span>Ø Dauer/Tag</span></div><div><b>${all.length}</b><span>Sessions gesamt</span></div></div></div>
  <div class="card"><h3>Minuten pro Tag</h3><svg class="chart" viewBox="0 0 ${W} ${Hh}">${bars}</svg></div>
  <div class="card"><h3>Tageszeiten <span class="muted small">letzte 30 Tage</span></h3>${all.length?`<svg class="chart" viewBox="0 0 ${W} ${Hh}">${hb}</svg><div class="muted small" style="margin-top:4px">Am häufigsten zwischen ${peak}:00 und ${peak+1}:00 Uhr.</div>`:`<div class="muted small">Noch keine Daten.</div>`}</div>
  <div class="card"><h3>Verlauf <button class="btn sec" style="padding:6px 11px;font-size:12.5px" data-act="hadd">+ Nachtragen</button></h3>${hist||`<div class="muted small">Noch keine Sessions in den letzten 14 Tagen.</div>`}</div>
  <div class="grid2" style="margin-bottom:12px"><button class="btn ghost" data-act="hnew">+ Gewohnheit</button><button class="btn ghost" data-act="hmanage">Verwalten</button></div>`;
}

let lastHabOngoing="";
function syncHabitNotifs(){
  if(!NATIVE||!NATIVE.habitOngoing)return;
  const H=hab(),key=JSON.stringify(H.active)+H.list.map(h=>h.name).join();
  if(key===lastHabOngoing)return; lastHabOngoing=key;
  H.list.forEach(h=>{try{if(H.active[h.id])NATIVE.habitOngoing(h.id,`${h.ic} ${h.name} läuft`,String(H.active[h.id]));else NATIVE.habitClear(h.id)}catch(e){}});
}
function applyHabitStops(){
  if(!NATIVE||!NATIVE.takeHabitStops)return;
  let stops=[];try{stops=JSON.parse(NATIVE.takeHabitStops()||"[]")}catch(e){}
  stops.sort((a,b)=>a.at-b.at).forEach(s=>{const H=hab();
    if(s.t==="start"){if(!H.active[s.h]&&H.list.some(h=>h.id===s.h)){H.active[s.h]=s.at;save()}}
    else if(H.active[s.h])habStop(s.h,s.at);});
  if(stops.length)render();
}

/* ---------- Daten ---------- */
const KEY='fitlog.v1';
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-5);
const TYPES={reps:'Wiederholungen',weight:'Gewicht + Wdh',time:'Zeit'};
const DEFAULT_EX=[
 ['liegestuetze','Liegestütze','reps'],['situps','Sit-ups','reps'],['planke','Planke','time'],
 ['kniebeugen','Kniebeugen','reps'],['klimmzuege','Klimmzüge','reps'],['ausfall','Ausfallschritte','reps'],
 ['burpees','Burpees','reps'],['crunches','Crunches','reps'],['dips','Dips','reps'],
 ['mountain','Mountain Climbers','reps'],['wandsitzen','Wandsitzen','time'],['seitstuetz','Seitstütz','time'],
 ['bank','Bankdrücken','weight'],['kreuzheben','Kreuzheben','weight'],['hkniebeuge','Kniebeugen mit Hantel','weight'],
 ['curls','Bizepscurls','weight'],['schulter','Schulterdrücken','weight'],['rudern','Rudern','weight']
];
function defaults(){
  return {v:1,
    exercises:DEFAULT_EX.map(([id,name,type])=>({id,name,type})),
    workouts:[
      {id:uid(),name:'Ganzkörper Basis',items:[{ex:'liegestuetze',sets:3,target:10,weight:0},{ex:'kniebeugen',sets:3,target:15,weight:0},{ex:'situps',sets:3,target:15,weight:0},{ex:'planke',sets:3,target:30,weight:0}]},
      {id:uid(),name:'Core',items:[{ex:'planke',sets:2,target:45,weight:0},{ex:'crunches',sets:3,target:20,weight:0},{ex:'mountain',sets:3,target:20,weight:0},{ex:'seitstuetz',sets:2,target:30,weight:0}]},
      {id:uid(),name:'Hantel Oberkörper',items:[{ex:'bank',sets:3,target:8,weight:40},{ex:'schulter',sets:3,target:10,weight:15},{ex:'curls',sets:3,target:12,weight:10}]}
    ],
    sessions:[],xp:0,badges:{},records:{},prCount:0,active:null,createdOwn:false,
    settings:{rest:60,step:2.5,goal:3}};
}
let F;
function fitLoad(){
  let raw=null;
  try{ if(window.AndroidBridge&&AndroidBridge.loadFile) raw=AndroidBridge.loadFile('fitlog.json'); }catch(e){}
  if(!raw){ try{ raw=localStorage.getItem(KEY);}catch(e){} }
  try{ F=raw?JSON.parse(raw):null; }catch(e){ F=null; }
  if(!F||!F.exercises){ F=defaults(); }
  F.settings=Object.assign({rest:60,step:2.5,goal:3},F.settings||{});
}
let saveT=null;
function fitSave(now){
  clearTimeout(saveT);
  const f=()=>{ const j=JSON.stringify(F);
    try{ localStorage.setItem(KEY,j);}catch(e){}
    try{ if(window.AndroidBridge&&AndroidBridge.saveFile) AndroidBridge.saveFile('fitlog.json',j);}catch(e){} };
  if(now) f(); else saveT=setTimeout(f,300);
  if(typeof schedulePush==="function"&&!syncNow.applying)schedulePush();
}
const getEx=id=>F.exercises.find(e=>e.id===id)||{id,name:'(gelöscht)',type:'reps'};
const getW=id=>F.workouts.find(w=>w.id===id);
const fmt=n=>String(Math.round(n*100)/100).replace('.',',');
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const vib=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};

/* ---------- Belohnungen ---------- */
const TITLES=[[1,'Einsteiger'],[3,'Aufsteiger'],[6,'Sportler'],[10,'Athlet'],[15,'Krieger'],[20,'Champion'],[30,'Legende']];
function levelInfo(xp){
  let lv=1,base=0,need=100;
  while(xp>=base+need){base+=need;lv++;need=100+(lv-1)*50;}
  let title=TITLES[0][1]; for(const [l,t] of TITLES) if(lv>=l) title=t;
  return {lv,into:xp-base,need,title,pct:Math.min(100,(xp-base)/need*100)};
}
function stats(){
  const r={n:F.sessions.length,reps:0,push:0,abs:0,vol:0,plank:0,early:0,night:0,long:0,minutes:0};
  for(const s of F.sessions){
    const h=new Date(s.start).getHours();
    if(h<7) r.early=1; if(h>=22) r.night=1;
    const dur=(s.end-s.start)/60000; r.minutes+=dur; if(dur>=45) r.long=1;
    for(const en of s.entries){ const t=getEx(en.ex).type;
      for(const st of en.sets){
        if(t==='time'){ if(en.ex==='planke'||en.ex==='seitstuetz') r.plank=Math.max(r.plank,st.sec); continue; }
        r.reps+=st.reps;
        if(en.ex==='liegestuetze') r.push+=st.reps;
        if(en.ex==='situps'||en.ex==='crunches') r.abs+=st.reps;
        if(t==='weight') r.vol+=st.reps*st.weight;
      }}
  }
  const days=new Set(F.sessions.map(s=>dayKey(s.start)));
  let cur=0,d=new Date(); d.setHours(12);
  if(!days.has(dayKey(d))) d.setDate(d.getDate()-1);
  while(days.has(dayKey(d))){cur++;d.setDate(d.getDate()-1);}
  // beste Serie
  let best=0; const sorted=[...days].map(k=>{const [y,m,dd]=k.split('-');return new Date(+y,m-1,+dd,12).getTime()}).sort((a,b)=>a-b);
  let run=0,prev=null; for(const t of sorted){ run=(prev&&Math.round((t-prev)/864e5)===1)?run+1:1; best=Math.max(best,run); prev=t; }
  r.streak=cur; r.bestStreak=best;
  const mon=new Date(); mon.setHours(0,0,0,0); mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  r.week=F.sessions.filter(s=>s.start>=mon.getTime()).length;
  r.prs=F.prCount||0; r.own=F.createdOwn?1:0;
  return r;
}

 ['long','⏳','Ausdauer','45 min Training',s=>s.long,1],
 ['own','🛠️','Architekt','Eigenes Training erstellen',s=>s.own,1],
];
function checkBadges(){
  const st=stats(),fresh=[];
  for(const b of BADGES){ if(!F.badges[b[0]]&&b[4](st)>=b[5]){F.badges[b[0]]=Date.now();fresh.push(b);} }
  return fresh;
}
function isPR(t,rec,st){
  if(!rec) return false;
  if(t==='time') return st.sec>rec.sec;
  if(t==='weight') return st.weight>rec.weight||(st.weight===rec.weight&&st.reps>rec.wreps);
  return st.reps>rec.reps;
}
function updateRec(t,exId,st){
  const r=F.records[exId]||(F.records[exId]={reps:0,sec:0,weight:0,wreps:0});
  r.reps=Math.max(r.reps,st.reps||0); r.sec=Math.max(r.sec,st.sec||0);
  if(t==='weight'&&(st.weight>r.weight||(st.weight===r.weight&&st.reps>r.wreps))){r.weight=st.weight;r.wreps=st.reps;}
}
function setXP(t,st){
  if(t==='time') return st.sec/3;
  if(t==='weight') return st.reps+st.reps*st.weight/20;
  return st.reps;
}

/* ---------- Stepper ---------- */
function stepper(k,f,val,step,unit,dec){
  return `<div class="step"><button class="stb" ${k} data-f="${f}" data-d="-${step}">−</button>
   <div class="sv"><input ${k} data-f="${f}" value="${fmt(val)}" inputmode="${dec?'decimal':'numeric'}" onfocus="this.select()" oninput="onIn(this)">${unit?`<small>${unit}</small>`:''}</div>
   <button class="stb" ${k} data-f="${f}" data-d="${step}">+</button></div>`;
}
function setVal(el,val){
  const {k,e,s,f}=el.dataset;
  if(k==='d'){ draft.items[e][f]=f==='sets'?Math.max(1,Math.round(val)):val; }
  else if(k==='s'&&F.active){ F.active.entries[e].sets[s][f]=val; fitSave(); }
}
function onIn(inp){ setVal(inp,Math.max(0,num(inp.value))); }
function bump(btn){
  const inp=btn.parentElement.querySelector('input');
  const d=num(btn.dataset.d);
  let v=Math.max(btn.dataset.f==='sets'?1:0,Math.round((num(inp.value)+d)*100)/100);
  inp.value=fmt(v); setVal(inp,v); vib(8);
}
let holdT=null,holdI=null,holdB=null,held=false;
document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.stb'); if(!b) return;
  holdB=b; held=false;
  holdT=setTimeout(()=>{held=true;bump(b);holdI=setInterval(()=>bump(b),75)},380);
});
document.addEventListener('pointerup',e=>{
  clearTimeout(holdT);clearInterval(holdI);
  if(holdB&&!held&&e.target.closest('.stb')===holdB) bump(holdB);
  holdB=null;
});
document.addEventListener('pointercancel',()=>{clearTimeout(holdT);clearInterval(holdI);holdB=null;});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.stb'))e.preventDefault();});

/* ---------- Training läuft ---------- */
function lastEntry(exId){
  for(const s of F.sessions){ const en=s.entries.find(e=>e.ex===exId); if(en) return en; }
  return null;
}
function startWorkout(id){
  if(F.active){ confirmBox('Es läuft schon ein Training. Verwerfen und neu starten?','Neu starten',()=>{F.active=null;startWorkout(id);}); return; }
  const w=id?getW(id):null;
  const entries=w?w.items.map(it=>{
    const last=lastEntry(it.ex),sets=[];
    for(let i=0;i<it.sets;i++){
      const ls=last&&(last.sets[i]||last.sets[last.sets.length-1]);
      sets.push(ls?{reps:ls.reps,weight:ls.weight,sec:ls.sec,done:false}:{reps:it.target,weight:it.weight||0,sec:it.target,done:false});
    }
    return {ex:it.ex,sets};
  }):[];
  F.active={id:uid(),wid:w?w.id:null,name:w?w.name:'Freies Training',start:Date.now(),entries,hit:{}};
  fitSave(true); go('session');
  if(!w) setTimeout(()=>openPicker('session'),250);
}

function updProg(){
  const a=F.active; if(!a) return;
  let tot=0,d=0; a.entries.forEach(e=>e.sets.forEach(s=>{tot++;if(s.done)d++;}));
  const el=document.getElementById('pg'); if(el) el.style.width=(tot?d/tot*100:0)+'%';
}
function tick(ei,si){
  const a=F.active,en=a.entries[ei],st=en.sets[si],t=getEx(en.ex).type;
  st.done=!st.done;
  document.getElementById('r'+ei+'_'+si).classList.toggle('done',st.done);
  updProg(); fitSave();
  if(st.done){
    vib(25);
    if(isPR(t,F.records[en.ex],st)&&!a.hit[en.ex+'_'+si]){a.hit[en.ex+'_'+si]=1;toast('🏆 Neuer Rekord!');vib([30,60,30]);}
    const left=a.entries.some(e=>e.sets.some(s=>!s.done));
    if(left) startRest(); else { stopRest(); toast('Alles erledigt – tippe auf Fertig ✓'); }
  }
}
function addSet(ei){
  const en=F.active.entries[ei],l=en.sets[en.sets.length-1]||{reps:10,weight:0,sec:30};
  en.sets.push({reps:l.reps,weight:l.weight,sec:l.sec,done:false}); fitSave(); fitRender(true);
}
function rmSet(ei){F.active.entries[ei].sets.pop();fitSave();fitRender(true);}
function rmEntry(ei){
  const n=getEx(F.active.entries[ei].ex).name;
  confirmBox(esc(n)+' aus diesem Training entfernen?','Entfernen',()=>{F.active.entries.splice(ei,1);fitSave();fitRender(true);});
}
function discard(){confirmBox('Training verwerfen? Nichts wird gespeichert.','Verwerfen',()=>{F.active=null;stopRest();fitSave(true);go('home');});}

/* Stoppuhr für Zeit-Übungen */
let wt=null;
function watch(ei,si){
  const btn=document.getElementById('w'+ei+'_'+si);
  if(wt){ const same=wt.ei===ei&&wt.si===si; stopWatch(); if(same) return; }
  stopRest();
  const st=F.active.entries[ei].sets[si],t0=Date.now();
  btn.classList.add('run'); btn.textContent='■';
  const inp=document.querySelector(`#r${ei}_${si} input`);
  wt={ei,si,i:setInterval(()=>{st.sec=Math.round((Date.now()-t0)/1000);if(inp)inp.value=st.sec;},250)};
  st.sec=0; if(inp) inp.value=0; vib(20);
}
function stopWatch(){
  if(!wt) return; clearInterval(wt.i);
  const {ei,si}=wt; wt=null;
  const btn=document.getElementById('w'+ei+'_'+si); if(btn){btn.classList.remove('run');btn.textContent='⏱';}
  fitSave(); if(F.active&&!F.active.entries[ei].sets[si].done) tick(ei,si);
}

/* Pausentimer */
let rest=null;
function startRest(){
  stopRest(); const dur=F.settings.rest; if(!dur) return;
  const end=Date.now()+dur*1000, el=document.getElementById('rest');
  rest={end,dur};
  const draw=()=>{
    const left=(rest.end-Date.now())/1000;
    if(left<=0){stopRest();vib([200,100,200]);toast('⏰ Pause vorbei – weiter!');return;}
    el.innerHTML=`<div><div class="sub" style="font-size:11px">PAUSE</div><div class="t">${mmss(left)}</div></div>
      <div class="bar"><i style="width:${left/rest.dur*100}%;transition:none"></i></div>
      <button class="btn sm" onclick="rest.end+=15000;rest.dur+=15">+15</button><button class="icon" onclick="stopRest()">✕</button>`;
  };
  el.classList.add('show'); draw(); rest.i=setInterval(draw,250);
}
function stopRest(){ if(rest){clearInterval(rest.i);rest=null;} document.getElementById('rest').classList.remove('show'); }
setInterval(()=>{const e=document.getElementById('elapsed');if(e&&F.active)e.textContent=mmss((Date.now()-F.active.start)/1000);},1000);

/* Abschließen + Belohnung */
function finishPrompt(){
  stopWatch();
  const a=F.active,done=a.entries.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);
  const open=a.entries.reduce((n,e)=>n+e.sets.filter(s=>!s.done).length,0);
  if(!done){toast('Hake mindestens einen Satz ab ✓');return;}
  if(open) confirmBox(`${open} Satz/Sätze nicht abgehakt. Trotzdem beenden? Offene Sätze werden nicht gezählt.`,'Beenden',finish);
  else finish();
}
function finish(){
  stopRest();
  const a=F.active,before=levelInfo(F.xp);
  const entries=a.entries.map(e=>({ex:e.ex,sets:e.sets.filter(s=>s.done).map(s=>({reps:Math.round(s.reps),weight:s.weight,sec:Math.round(s.sec)}))})).filter(e=>e.sets.length);
  let xp=0; const prs=[];
  for(const en of entries){
    const t=getEx(en.ex).type,rec=F.records[en.ex]; let pr=false;
    for(const st of en.sets){ xp+=setXP(t,st); if(isPR(t,rec,st)) pr=true; }
    if(pr){prs.push(en.ex);F.prCount=(F.prCount||0)+1;}
    for(const st of en.sets) updateRec(t,en.ex,st);
  }
  const base=Math.round(xp),bonus=20,prB=prs.length*15;
  const sess={id:a.id,wid:a.wid,name:a.name,start:a.start,end:Date.now(),entries};
  F.sessions.unshift(sess); F.active=null;
  const st=stats(),strB=Math.min(st.streak,10)*3;
  const total=base+bonus+prB+strB; sess.xp=total; F.xp+=total;
  const nb=checkBadges(),after=levelInfo(F.xp);
  fitSave(true); go('home');
  let h=`<div class="grab"></div><div class="sum">
    <div class="em">${after.lv>before.lv?'🎉':'💪'}</div>
    <h2 style="margin:6px 0 2px">${after.lv>before.lv?'Level '+after.lv+' erreicht!':'Stark gemacht!'}</h2>
    <div class="sub">${mmss((sess.end-sess.start)/1000)} min · ${entries.reduce((n,e)=>n+e.sets.length,0)} Sätze</div>
    <div class="big" style="margin:18px 0 4px">+${total}</div><div class="sub">XP</div>
    <div class="bar" style="margin:16px 0 4px"><i id="sumbar" style="width:${after.lv>before.lv?0:before.pct}%"></i></div>
    <div class="sub" style="text-align:left">Level ${after.lv} · ${after.title} · ${after.into}/${after.need}</div>
    <div class="li"><span class="e">🔥</span><div class="grow">≈ ${Math.round(sessionKcal(sess))} kcal verbrannt<div class="sub">Wird bei „Heute“ gutgeschrieben</div></div></div>
    <div class="li"><span class="e">🏋️</span><div class="grow">Leistung</div><b>+${base}</b></div>
    <div class="li"><span class="e">✅</span><div class="grow">Training abgeschlossen</div><b>+${bonus}</b></div>
    ${strB?`<div class="li"><span class="e">🔥</span><div class="grow">${st.streak} ${st.streak===1?'Tag':'Tage'} Serie</div><b>+${strB}</b></div>`:''}
    ${prs.map(p=>`<div class="li"><span class="e">🏆</span><div class="grow">Rekord: ${esc(getEx(p).name)}</div><b>+15</b></div>`).join('')}
    ${nb.map(b=>`<div class="li" style="background:linear-gradient(160deg,var(--brandSoft),var(--card))"><span class="e">${b[1]}</span><div class="grow"><b>${b[2]}</b><div class="sub">Neues Abzeichen · ${b[3]}</div></div></div>`).join('')}
    <button class="btn acc wide" style="margin-top:18px" onclick="closeModal()">Weiter</button></div>`;
  showModal(h);
  setTimeout(()=>{const b=document.getElementById('sumbar');if(b)b.style.width=after.pct+'%';},350);
  confetti(); vib([40,60,40,60,80]);
}

/* ---------- Verlauf ---------- */
const MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
function vHistory(){
  const st=stats();
  let html=`<div class="screen">
   <div class="card"><div class="row"><div class="grow"><b>Letzte 8 Wochen</b><div class="sub">Trainings pro Woche</div></div><span class="chip acc">Ziel ${F.settings.goal}</span></div>
   <div class="week">`;
  const mon=new Date(); mon.setHours(0,0,0,0); mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  const weeks=[]; for(let i=7;i>=0;i--){const a=new Date(mon);a.setDate(a.getDate()-i*7);const b=new Date(a);b.setDate(b.getDate()+7);
    weeks.push({l:a.getDate()+'.'+(a.getMonth()+1),n:F.sessions.filter(s=>s.start>=a&&s.start<b).length});}
  const mx=Math.max(F.settings.goal,...weeks.map(w=>w.n));
  html+=weeks.map(w=>`<div><i class="${w.n>=F.settings.goal?'on':''}" style="height:${w.n/mx*70+6}%"></i><span>${w.l}</span></div>`).join('');
  html+=`</div></div>
   <div class="stats" style="margin:0 0 6px"><div class="stat card" style="margin:0"><b>${Math.round(st.minutes)}</b><span>Minuten</span></div>
   <div class="stat card" style="margin:0"><b>${st.reps>=10000?fmt(Math.round(st.reps/100)/10)+'k':st.reps}</b><span>Wiederholungen</span></div>
   <div class="stat card" style="margin:0"><b>${st.vol>=1000?fmt(Math.round(st.vol/100)/10)+' t':Math.round(st.vol)+' kg'}</b><span>Volumen</span></div></div>
   <h3>Einheiten</h3>`;
  if(!F.sessions.length) html+=`<div class="empty"><div class="e">📅</div>Hier erscheinen deine absolvierten Trainings.</div>`;
  for(const s of F.sessions){
    const d=new Date(s.start),n=s.entries.reduce((k,e)=>k+e.sets.length,0);
    html+=`<div class="card hi" onclick="go('detail','${s.id}')"><div class="date"><b>${d.getDate()}</b><span>${MON[d.getMonth()]}</span></div>
     <div class="grow"><b>${esc(s.name)}</b><div class="sub">${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} · ${Math.max(1,Math.round((s.end-s.start)/60000))} min · ${n} Sätze</div></div>
     <span class="chip acc">+${s.xp||0} XP</span></div>`;
  }
  return html+'</div>';
}
function vDetail(){
  const s=F.sessions.find(x=>x.id===ui.param); if(!s) return vHistory();
  const d=new Date(s.start);
  let html=`<div class="screen"><div class="top"><button class="icon" onclick="go('history')">←</button>
   <div class="grow"><h2>${esc(s.name)}</h2><div class="sub">${d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})} · ${Math.max(1,Math.round((s.end-s.start)/60000))} min</div></div>
   <span class="chip acc">+${s.xp||0} XP</span></div>`;
  for(const en of s.entries){
    const ex=getEx(en.ex),t=ex.type;
    html+=`<div class="card"><div class="ename" style="margin-bottom:6px">${esc(ex.name)}</div><table class="tbl">`+
     en.sets.map((st,i)=>`<tr><td>Satz ${i+1}</td><td>${t==='time'?st.sec+' s':t==='weight'?st.reps+' × '+fmt(st.weight)+' kg':st.reps+' Wdh'}</td></tr>`).join('')+'</table></div>';
  }
  html+=`<button class="btn danger wide" style="margin-top:14px" onclick="delSession('${s.id}')">Einheit löschen</button></div>`;
  return html;
}
function delSession(id){
  confirmBox('Diese Einheit löschen? (XP bleiben erhalten)','Löschen',()=>{F.sessions=F.sessions.filter(s=>s.id!==id);fitSave(true);go('history');});
}

/* ---------- Erfolge ---------- */
function vAwards(){
  const L=levelInfo(F.xp),st=stats(),C=2*Math.PI*40;
  const got=BADGES.filter(b=>F.badges[b[0]]).length;
  let html=`<div class="screen">
   <div class="card hero lvl"><div class="ring"><svg width="92" height="92"><circle cx="46" cy="46" r="40" stroke="var(--line)" stroke-width="8" fill="none"/>
     <circle cx="46" cy="46" r="40" stroke="var(--acc)" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-L.pct/100)}"/></svg>
     <b><small>LEVEL</small>${L.lv}</b></div>
     <div class="grow"><h2>${L.title}</h2><div class="sub" style="margin:4px 0 8px">${F.xp} XP gesamt · noch ${L.need-L.into} bis Lv ${L.lv+1}</div>
     <div class="row"><span class="chip gold">🔥 Beste Serie ${st.bestStreak}</span></div></div></div>
   <h3>Abzeichen · ${got}/${BADGES.length}</h3><div class="badges">`;
  for(const b of BADGES){
    const on=!!F.badges[b[0]],v=Math.min(b[4](st),b[5]);
    const p=on?new Date(F.badges[b[0]]).toLocaleDateString('de-DE'):(b[5]>1?Math.floor(v).toLocaleString('de-DE')+' / '+b[5].toLocaleString('de-DE'):'gesperrt');
    html+=`<div class="badge ${on?'on':'off'}" onclick="toast('${b[1]} ${esc(b[3])}')"><div class="e">${b[1]}</div><div class="n">${b[2]}</div><div class="p">${p}</div></div>`;
  }
  html+=`</div><h3>Persönliche Rekorde</h3>`;
  const recs=Object.entries(F.records);
  if(!recs.length) html+=`<div class="empty" style="padding:20px">Noch keine Rekorde – trainiere los!</div>`;
  else html+='<div class="card"><table class="tbl">'+recs.map(([id,r])=>{const t=getEx(id).type;
    return `<tr><td>${esc(getEx(id).name)}</td><td><b style="color:var(--text)">${t==='time'?r.sec+' s':t==='weight'?fmt(r.weight)+' kg × '+r.wreps:r.reps+' Wdh'}</b></td></tr>`}).join('')+'</table></div>';
  return html+`<div class="sub" style="margin:16px 4px">So gibt's XP: 1 pro Wiederholung, +Gewicht-Bonus, 1 pro 3 s Halten, +20 pro Training, +15 pro Rekord, bis +30 für Serien.</div></div>`;
}

/* ---------- Einstellungen ---------- */
function vSettings(){
  const s=F.settings;
  const seg=(key,opts,lab)=>`<div class="seg">${opts.map(o=>`<button class="${s[key]===o?'on':''}" onclick="F.settings.${key}=${o};fitSave(true);fitRender(true)">${lab(o)}</button>`).join('')}</div>`;
  const custom=F.exercises.filter(e=>e.custom);
  return `<div class="screen"><div class="top"><button class="icon" onclick="go('awards')">←</button><h2 class="grow">Einstellungen</h2></div>
   <h3>Pausentimer nach jedem Satz</h3>${seg('rest',[0,30,60,90,120],o=>o?o+' s':'Aus')}
   <h3>Gewichts-Schritt (+/−)</h3>${seg('step',[1,2.5,5],o=>fmt(o)+' kg')}
   <h3>Wochenziel (Trainings)</h3>${seg('goal',[1,2,3,4,5,6,7],o=>o)}
   <h3>Eigene Übungen</h3>
   ${custom.length?'<div class="card" style="padding:4px 14px">'+custom.map(e=>`<div class="pick" style="cursor:default"><div class="grow"><b>${esc(e.name)}</b><div class="sub">${TYPES[e.type]}</div></div><button class="icon sm" onclick="delEx('${e.id}')">🗑</button></div>`).join('')+'</div>':'<div class="sub" style="margin:0 4px">Noch keine – du kannst sie beim Hinzufügen einer Übung anlegen.</div>'}
   <h3>Daten</h3>
   <button class="btn wide" onclick="exportData()">Backup exportieren</button>
   <button class="btn wide" onclick="importData()">Backup importieren</button>
   <button class="btn danger wide" onclick="confirmBox('Wirklich ALLE Daten löschen?','Alles löschen',()=>{F=defaults();fitSave(true);go('home');})">Alles zurücksetzen</button>
   <div class="sub" style="text-align:center;margin:24px 0">FitLog 1.0 · Daten bleiben nur auf deinem Gerät</div></div>`;
}
function delEx(id){
  const used=F.workouts.some(w=>w.items.some(i=>i.ex===id));
  confirmBox(used?'Übung wird in Trainings verwendet und dort entfernt. Löschen?':'Übung löschen?','Löschen',()=>{
    F.exercises=F.exercises.filter(e=>e.id!==id); F.workouts.forEach(w=>w.items=w.items.filter(i=>i.ex!==id)); fitSave(true); fitRender(true);});
}
function exportData(){
  const j=JSON.stringify(F);
  if(window.Android&&Android.share){Android.share(j);return;}
  showModal(`<div class="grab"></div><h2 style="margin-bottom:10px">Backup</h2><textarea class="io" readonly>${esc(j)}</textarea><button class="btn wide" onclick="closeModal()">Schließen</button>`);
}
function importData(){
  showModal(`<div class="grab"></div><h2 style="margin-bottom:6px">Backup importieren</h2><div class="sub" style="margin-bottom:10px">Füge den exportierten Text ein. Aktuelle Daten werden ersetzt.</div>
   <textarea class="io" id="imp" placeholder="{ … }"></textarea><button class="btn acc wide" onclick="doImport()">Importieren</button>`);
}
function doImport(){
  try{const d=JSON.parse(document.getElementById('imp').value);if(!d.exercises||!d.sessions)throw 0;F=d;load2();fitSave(true);closeModal();go('home');toast('✓ Backup geladen');}
  catch(e){toast('Ungültiges Backup');}
}
function load2(){F.settings=Object.assign({rest:60,step:2.5,goal:3},F.settings||{});}

/* ---------- UI-Helfer ---------- */
function showModal(h){$("#sheet").innerHTML=`<div class="sb fit sheetpad" style="padding-top:12px">${h}</div>`;$("#scrim").classList.add("open");document.body.style.overflow="hidden";}
function closeModal(){closeSheet();}
let cbFn=null;
function confirmBox(text,yes,fn){
  cbFn=fn;
  showModal(`<div class="grab"></div><div style="font-size:17px;font-weight:650;margin:6px 4px 18px;line-height:1.4">${text}</div>
   <div class="row"><button class="btn grow" onclick="closeModal()">Abbrechen</button><button class="btn grow danger" onclick="closeModal();cbFn&&cbFn()">${yes}</button></div>`);
}
function confetti(){
  const c=document.getElementById('confetti'),x=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight;
  const cols=['#14B8A6','#F5C451','#7CB8FF','#FF8FA3','#ffffff'];
  const p=Array.from({length:120},()=>({x:W/2,y:H*.35,vx:(Math.random()-.5)*12,vy:Math.random()*-12-4,s:Math.random()*6+4,c:cols[Math.random()*5|0],r:Math.random()*6,vr:(Math.random()-.5)*.3}));
  let f=0;(function loop(){x.clearRect(0,0,W,H);
    p.forEach(o=>{o.vy+=.35;o.vx*=.99;o.x+=o.vx;o.y+=o.vy;o.r+=o.vr;x.save();x.translate(o.x,o.y);x.rotate(o.r);x.fillStyle=o.c;x.globalAlpha=Math.max(0,1-f/140);x.fillRect(-o.s/2,-o.s/4,o.s,o.s/2);x.restore();});
    if(++f<140)requestAnimationFrame(loop);else x.clearRect(0,0,W,H);})();
}



/* ===================== Start ===================== */
fitLoad();loadP();loadSY();
if(loggedIn()){startPolling();setTimeout(()=>syncNow(),1500)}
if(S.profile&&["#fast","#today","#train"].includes(location.hash)){tab=location.hash.slice(1);if(tab==="train"&&F.active)ui.view="session"}
render();
syncNotifs();
document.addEventListener("visibilitychange",()=>{if(document.hidden){stopScan();fitSave(true)}else{syncNotifs();applyHabitStops();if(loggedIn())syncNow();if(["today","stats","fast"].includes(tab))render()}});
applyHabitStops();syncHabitNotifs();pushQuick();
if(S.profile&&Date.now()-(S.lastUpdCheck||0)>6*36e5)setTimeout(()=>checkUpdate(false),4000);
</script>
